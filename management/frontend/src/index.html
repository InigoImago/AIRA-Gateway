<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIRA Gateway — Management</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content Security Policy (ADR-0007), stating what is true of the bundle wherever it is served.
      The SPA is self-contained: all scripts, styles, and assets ship with the bundle, so nothing
      needs to be loaded from a third party. Angular injects component styles as inline <style>
      elements, hence 'unsafe-inline' for styles only — scripts stay locked to same-origin, which
      is what stops an injected payload from running. Nothing is framed: a session is renewed with
      the refresh token, not a hidden iframe.

      Connections are the deployment's to narrow. The issuer is configuration (runtime-config.js),
      which a built file cannot name, so nginx sends a second policy as a header that limits
      `connect-src` to this origin and the issuer (deploy/aira-headers.inc.template), and a browser
      enforces both. Under `ng serve` this one is the only policy, and the development realm's
      issuer on another port has to stay reachable. `frame-ancestors` cannot be set from a meta
      tag; the header sends it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src 'self' http: https: ws: wss:;
               frame-src 'none';
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <!--
      The tab icon. The SVG is what every current browser uses; Safari has never supported an SVG
      favicon, so the `.ico` is the fallback rather than a leftover — it is generated from the same
      mark by `tools/make_favicon.py`, because a second hand-made image is a second definition of
      one logo and this one sat unnoticed as Angular's default from Phase 0 until the owner saw it
      in a tab.
    -->
    <link rel="icon" type="image/svg+xml" href="aira-mark.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="aira-mark.svg" />
    <!--
      Deployment-time configuration, loaded before the bundle. Replaced per environment without a
      rebuild; see public/runtime-config.js. Same-origin, so the CSP above already allows it.
    -->
    <script src="runtime-config.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
