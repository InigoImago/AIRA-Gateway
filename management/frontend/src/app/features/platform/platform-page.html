<div class="platform">
  <nav class="platform__menu" aria-label="Platform administration">
    <h2 class="platform__title">Platform administration</h2>
    <p class="muted platform__intro">What the platform roles look after across every use case.</p>
    @if (may('content_read.read')) {
      <a
        class="platform__item"
        routerLink="content-reads"
        routerLinkActive="is-active"
        data-testid="platform-nav-content-reads"
        >Content reads</a
      >
    }
    @if (may('role.read')) {
      <a
        class="platform__item"
        routerLink="roles"
        routerLinkActive="is-active"
        data-testid="platform-nav-roles"
        >Roles</a
      >
    }
    @if (menuError(); as message) {
      <p class="field__hint field__hint--error" role="alert" data-testid="platform-menu-error">
        {{ message }}
      </p>
    }
  </nav>
  <section class="platform__page">
    <router-outlet />
  </section>
</div>
