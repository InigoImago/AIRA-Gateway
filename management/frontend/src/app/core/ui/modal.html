@if (open()) {
  <div #backdrop class="modal-backdrop" (click)="closeIfOpen()"></div>
  <div
    #dialog
    class="modal"
    [class]="panelClass()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="testid() + '-title'"
    [attr.data-testid]="testid()"
    tabindex="-1"
    (keydown)="keepFocus($event)"
  >
    <div class="modal__head">
      <h3 class="modal__title" [id]="testid() + '-title'">{{ title() }}</h3>
      @if (dismissible()) {
        <button
          type="button"
          class="btn btn--sm btn--ghost"
          aria-label="Close"
          [attr.data-testid]="testid() + '-close'"
          (click)="closed.emit()"
        >
          ✕
        </button>
      }
    </div>

    <div class="modal__body">
      <ng-content select="[modal-body]" />
      @if (!withFoot() && error()) {
        <p
          class="field__hint field__hint--error"
          role="alert"
          [attr.data-testid]="testid() + '-error'"
        >
          {{ error() }}
        </p>
      }
    </div>

    @if (withFoot()) {
      <div class="modal__foot">
        <!-- Above the buttons (`.modal__foot > .field__hint` takes its own line): it explains why
             the action did not happen, and an explanation under the control is found second. -->
        @if (error()) {
          <p
            class="field__hint field__hint--error"
            role="alert"
            [attr.data-testid]="testid() + '-error'"
          >
            {{ error() }}
          </p>
        }
        <ng-content select="[modal-foot]" />
      </div>
    }
  </div>
}
