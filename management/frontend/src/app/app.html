<header class="aira-header">
  <div class="aira-header__brand">
    <span class="aira-logo" aria-hidden="true">AI</span>
    <div>
      <h1>{{ title() }}</h1>
      <p class="aira-subtitle">Management &amp; Monitoring</p>
    </div>
  </div>
  @if (me(); as user) {
    <div class="aira-user">
      <span class="aira-user__name">{{ user.username }}</span>
      <!-- Which hat you are wearing, one chip per role. Half of what a role-based console has
           to answer is "why can I not do this", and the first step is showing which role is
           asking. `data-role` carries the slug, so the role is assertable without depending on
           the wording. -->
      @for (role of roleChips(); track role.slug) {
        <span class="aira-user__role" [attr.data-role]="role.slug" [title]="role.explains">{{
          role.label
        }}</span>
      }
      <button type="button" class="btn btn--sm" (click)="logout()">Logout</button>
    </div>
  }
</header>

<nav class="aira-nav" aria-label="Main navigation">
  <a class="aira-nav__item" routerLink="/use-cases" routerLinkActive="is-active">Use Cases</a>
  <a class="aira-nav__item" routerLink="/models" routerLinkActive="is-active"
    >Models &amp; prices</a
  >
  <a class="aira-nav__item" routerLink="/reporting" routerLinkActive="is-active">Reporting</a>
  <!--
    Screens that do not exist yet used to sit here as disabled tabs, one per oversight role. They
    read as broken navigation — somebody logs in as the administrator, sees "Administration", and
    finds it does not respond. A tab that cannot be clicked teaches nothing except that something
    is wrong.

    What each role *may* do is instead shown where they are: the use-case list says whose it is,
    and the roles are named in the header. When `FRD-500`/`501`/`503` build the security console,
    it becomes a real tab.
  -->
</nav>

<main class="aira-main">
  <router-outlet />
</main>
