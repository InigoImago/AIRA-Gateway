<header class="aira-header">
  <h1>{{ title() }}</h1>
  @if (me(); as user) {
    <div class="aira-user">
      <span>{{ user.username }}</span>
      <button type="button" (click)="logout()">Logout</button>
    </div>
  }
</header>

<nav class="aira-nav" aria-label="Main navigation">
  <a class="aira-nav__item" routerLink="/use-cases">Use Cases</a>
  @if (hasRole('it-security')) {
    <span class="aira-nav__item" data-role="it-security">Security</span>
  }
  @if (hasRole('it-steuerung')) {
    <span class="aira-nav__item" data-role="it-steuerung">Governance</span>
  }
  @if (hasRole('global-admin')) {
    <span class="aira-nav__item" data-role="global-admin">Administration</span>
  }
</nav>

<main class="aira-main">
  <router-outlet />
</main>
