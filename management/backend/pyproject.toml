[project]
name = "aira-management"
version = "0.1.0"
description = "AIRA Management & Monitoring backend (Django + DRF)."
requires-python = ">=3.14"
dependencies = [
    "aira-common",
    "django>=5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-guardian>=2.4",
    "opentelemetry-instrumentation-django>=0.50b0",
    # Django ships only `runserver`, which is explicitly not for production. The ASGI app in
    # config/asgi.py needs a real server to be deployable at all.
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aira_management"]
