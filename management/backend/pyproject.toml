[project]
name = "aira-management"
version = "0.1.0"
description = "AIRA Management & Monitoring backend (Django + DRF)."
requires-python = ">=3.14"
dependencies = [
    "aira-common",
    "django>=5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aira_management"]
