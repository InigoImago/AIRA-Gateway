# Datenschutzhinweise für AIRA Gateway — deutsche Fassung (`FRD-625`).
#
# Jede Tabelle hier muss es in jeder Sprache geben, mit denselben Schlüsseln und denselben
# {Platzhaltern}; `texts.parse` verweigert eine Datei, die davon abweicht. Wer hier etwas ändert,
# ändert die Hinweise: `edition.py` verlangt danach ein neues Datum.

