[project]
name = "aira-common"
version = "0.1.0"
description = "Shared building blocks for AIRA (config, logging, errors, events, health)."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    # `aira_common.observability` renders an OTLP batch as JSON for `AIRA_DEBUG_OTEL_PAYLOAD`,
    # which needs `google.protobuf.json_format`. It resolves today because the OTLP exporter above
    # pulls protobuf in — and a transitive dependency is one an upgrade may drop. The third time
    # this guard has caught the same shape; the two before it are named below.
    "protobuf>=5.28",
    "aiokafka>=0.12",
    # aira_common.oidc verifies JWTs and fetches JWKS; it was only ever resolvable because the
    # gateway happened to declare pyjwt and the dev environment installs the whole workspace.
    # An isolated management image has no gateway, and failed to import at startup.
    "pyjwt[crypto]>=2.9",
    # aira_common.secrets reads Vault over HTTP (FRD-116). Declared for exactly the reason above,
    # and the second time this project has learned it: the management image failed to import at
    # startup because `httpx` happened to be a *gateway* dependency and the dev environment
    # installs the whole workspace. `test_declared_dependencies.py` now checks it instead of
    # waiting for a container to say so.
    "httpx>=0.28",
    # aira_common.counters — shared atomic counters for rate limits and budget
    # reservations (ADR-0008).
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aira_common"]
