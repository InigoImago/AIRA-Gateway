[project]
name = "aira-common"
version = "0.1.0"
description = "Shared building blocks for AIRA (config, logging, errors, events, health)."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aira_common"]
