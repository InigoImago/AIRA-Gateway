name: CI

# The quality gates existed as `make` targets long before this file did, which meant they were
# only enforced when somebody remembered to run them. The jobs run **the commands those targets
# run** — `make lint-py` and `test-py` in `python`, `make lint-frontend` and `test-frontend` in
# `frontend` — written out here so each job installs its toolchain once rather than per target.
# Written out twice they can drift, so `tools/tests/test_ci_runs_what_a_developer_runs.py` checks
# every command of those targets appears in its job.

on:
  push:
    branches: ["**"]
    # **A release is an annotated tag** (`ADR-0030`). Publishing stays inside *this* workflow rather
    # than in one of its own, so the gates that guard it are the gates that ran on the tagged
    # commit: a separate workflow would have to ask GitHub whether some other run was green, which
    # is a weaker claim than it sounds — it can be about an older commit, a cancelled run, or a job
    # re-run until it passed.
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref; the default branch is exempt so its
# history keeps a result for every commit. A tag is exempt for a stronger reason: cancelling a
# release between two image pushes would leave a version half published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# **Every action is pinned to the commit its release tag named**, with that tag beside it. A tag
# can be moved to other code by whoever holds the action's repository, and the next run would
# execute it with this workflow's token; a commit cannot be moved. Raised by hand, tag and commit
# together. And **no checkout leaves the token in the clone**: nothing here pushes, and a token in
# `.git/config` is readable by every later step, the install scripts `npm ci` runs included.
# `tools/tests/test_a_release_is_published_only_behind_the_gates.py` holds both.
permissions:
  contents: read

jobs:
  python:
    name: Python — lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads .python-version, so the interpreter is pinned by the repository (ADR-0003)
      # rather than by this file.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy gateway/src libs/src management/backend/src

      # The coverage gate lives in pyproject.toml (--cov-fail-under), not here.
      - name: Unit tests
        run: uv run pytest

  frontend:
    name: Frontend — format, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: management/frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: management/frontend/.nvmrc
          cache: npm
          cache-dependency-path: management/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: |
          npx prettier --check "src/**/*.{ts,html,scss}"
          npx prettier --check "proxy.conf.cjs"

      # A production build, because that is where the CSP once silently disabled the entire
      # stylesheet — a development build would not have shown it.
      - name: Build
        run: npx ng build

      # Coverage thresholds live in angular.json.
      - name: Unit tests
        run: npx ng test --watch=false

      # **The browser suite is TypeScript too, and CI did not read it.**
      #
      # `make lint-frontend` has type-checked `e2e/` since 2026-08-18, added under a comment saying
      # *"a rule only a reviewer enforces is one the next file breaks"*. It was added to the
      # Makefile and not here — so the only thing running it was a person remembering to — and the
      # next file broke it: `installation-budget.spec.ts` landed on 2026-08-20 calling
      # `expectNoHorizontalOverflow(page)` with one argument of the two, and `main` was red for a
      # day. Playwright transpiles rather than type-checks, so the `browser` job below runs the suite
      # happily either way.
      #
      # Its own job step rather than `make lint-frontend`, because this job has already installed
      # exactly these dependencies and that target would rebuild the console a second time.
      - name: Browser suite — format and types
        working-directory: e2e
        run: |
          npm ci
          npx prettier --check "**/*.ts"
          npx tsc --noEmit -p tsconfig.json

  # **Real Gemini clients** (`FRD-143`): every major of the AI SDK's Google provider, with the `ai`
  # release it ships for, and Google's own `google-genai`, against the gateway on a socket. The
  # python job skips the Node half for want of an install; this job installs it and fails on a skip.
  clients:
    name: Clients — every AI SDK major and OpenCode 1 and 2 against the gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: management/frontend/.nvmrc
          cache: npm
          cache-dependency-path: tools/clients/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --frozen
          cd tools/clients && npm ci --no-audit --no-fund
          # OpenCode's terminal interface is read back from a tmux pane.
          sudo apt-get install -y --no-install-recommends tmux

      - name: Real clients
        run: AIRA_REQUIRE_REAL_CLIENTS=1 uv run pytest --no-cov gateway/tests/test_real_gemini_clients.py tools/tests/test_the_opencode_plugin_holds_its_properties.py

  # **Two stacks, side by side.** Each suite starts a stack of its own, so the longer of the two sets
  # the time and neither waits for the other: one after the other on one stack, they outgrew a
  # forty-minute job. The browser suite makes what it reads, so it needs nothing the integration
  # suite leaves behind.
  #
  # **And each suite twice, in each data mode** (`FRD-627`). Strict data mode is the default, and an
  # installation may switch it off; what a reader sees differs between the two, so both are what
  # ships. The suites ask the stack which mode it runs and check that mode's answer.
  stack:
    name: Stack — integration (strict data mode ${{ matrix.strict_data_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        strict_data_mode: ["true", "false"]
    env:
      AIRA_STRICT_DATA_MODE: ${{ matrix.strict_data_mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      # Builds the three application images and starts everything: infrastructure, both APIs,
      # the config consumer, the outbox relay and the SPA. Also the only check that the
      # Dockerfiles still build.
      - name: Start the full stack
        run: make up-full

      - name: Wait for the stack
        run: make wait-healthy

      # `wait-healthy` answers "do the endpoints respond?", which is not the question the suite
      # asks: it calls models, and both planes learn the catalogue through the seed, which waits
      # only for the model *pull* to start. `demo-ready` blocks until every demo credential and
      # every demo model has travelled seed → relay → Kafka → gateway, and is the same sequence
      # `make showcase` uses. Without it this job races the download (`FRD-130` §4f).
      - name: Wait for the demo's keys and models to reach the gateway
        run: make demo-ready

      - name: Integration tests
        run: uv run pytest -m integration --no-cov

      # Container logs are the only way to explain a failure that happened inside the stack.
      # Printed once: followed (`make logs-apps` locally), the step never ends and the job is
      # cancelled at its timeout with the failure's cause scrolled away.
      - name: Container logs on failure
        if: failure()
        timeout-minutes: 5
        run: make logs-apps FOLLOW= TAIL=500

      - name: Stop the stack
        if: always()
        run: make down-full

  browser:
    name: Stack — browser end-to-end (strict data mode ${{ matrix.strict_data_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        strict_data_mode: ["true", "false"]
    env:
      AIRA_STRICT_DATA_MODE: ${{ matrix.strict_data_mode }}
      # Management's per-user throttle, raised for this job only. The suite is one browser signed in
      # as a handful of demo accounts — mostly `admin` — loading screen after screen, each of which
      # asks for several panels at once and refreshes live; it crossed the 600 a minute a person
      # never reaches, and an API key it was issuing came back `429`. The throttle is not what this
      # job tests, and a test that waits it out tests the clock.
      AIRA_THROTTLE_USER: 6000/minute
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: management/frontend/.nvmrc

      - name: Install Python dependencies
        run: uv sync --frozen

      # The same stack the integration job starts, and the same wait: the suite calls models.
      - name: Start the full stack
        run: make up-full

      - name: Wait for the stack
        run: make wait-healthy

      - name: Wait for the demo's keys and models to reach the gateway
        run: make demo-ready

      - name: Install Playwright browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: e2e
        run: npx playwright test

      # A Windows domain beside the stack (`FRD-140`): Samba as the domain controller, and the
      # browser as one of its workstations. Last, because its suite gives the realm a federation for
      # the length of the run, and every suite above runs against a realm of local accounts.
      - name: Windows sign-on
        run: make test-windows-sso

      - name: Container logs on failure
        if: failure()
        timeout-minutes: 5
        run: make logs-apps FOLLOW= TAIL=500

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: make down-full

  # ── Releasing ───────────────────────────────────────────────────────────────────────────────────
  #
  # A release is an **annotated tag** `vX.Y.Z`, and its message is the release notes
  # (`ADR-0030`, `FRD-137`). Four jobs, cut by what each one may write (`ADR-0043`):
  #
  #   described   nothing                       the description check, in seconds, beside the gates
  #   publish     the images (packages)         Docker's build actions and nothing else from outside
  #   inventory   nothing                       Syft, reading the pushed images back by digest
  #   release     the Release, and a signature  GitHub's own actions only
  #
  # **A token is held only where it is used, beside code it has to trust.** A step can read the
  # token of every step in its job, so a permission granted to a job is granted to every action in
  # it. Pushing an image needs Docker's actions next to `packages: write`; nothing else from outside
  # GitHub runs where anything can be written, and the job that can mint the workflow's identity
  # runs GitHub's actions alone. **And no release job restores a cache**: caches are written by
  # ordinary pushes, so a release built from one is built from whatever the last push left there.
  described:
    name: The tag says what the release is
    # **No `needs`.** The one thing worth knowing in the first half-minute is whether the tag
    # carries a description at all, because that is the only failure a tagger can still fix for
    # free: a bare annotation discovered *after* forty minutes of gates is a release everyone has
    # already started waiting for. `v0.1.0` was published with the annotation `Release v0.1.0`,
    # which is what a mechanism with nowhere to put a description produces.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # **The tag's name reaches every script through the environment, and is quoted there.**
    # Written into a script as `${{ github.ref_name }}` it is spliced in as *code* before the shell
    # runs: Git allows `$(…)`, `;` and backticks in a tag name, `v*.*.*` matches such a name, and
    # the jobs that read it hold `contents: write` and `packages: write`. The first step refuses
    # any name that is not a release version, before a single command has used it.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The same spelling `tools/release_version.py` accepts — ASCII digits, no leading zero —
      # checked before checkout, so nothing below ever runs with any other name in `$TAG`.
      - name: Refuse a tag name that is not a release version
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the pushed tag is not a release version (vX.Y.Z)"
            exit 1
          fi

      # Full history and tags: the notes quote the commits since the previous release, and
      # `--depth 1` would make every release look like the first one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # On by default on GitHub's runners; a release job restores no cache (above).
          enable-cache: false

      - run: uv sync --frozen

      # **The tag object, which the checkout above flattens into a lightweight ref.**
      # `actions/checkout` creates `refs/tags/<name>` pointing at the *commit* it checked out, so
      # the annotated tag object — the thing that carries the release notes — is not in this
      # clone. `%(contents)` of a ref that points at a commit is **the commit's message**, which
      # is a plausible-looking description with a subject and a body, so nothing failed: `v0.1.1`
      # was published on 2026-10-11 with `def905f`'s commit message as its notes and
      # `fix(tests): wait for the rows a request makes, not for one` as its title.
      #
      # `--force` because the ref already exists, pointing at the commit. The type is then
      # asserted rather than assumed: if a future version of the checkout action changes this
      # again, the release must stop here and say so, not publish the nearest available prose.
      - name: Restore the annotated tag object
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          kind="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$kind" != tag ]; then
            echo "::error::refs/tags/$TAG is a $kind, not an annotated tag"
            exit 1
          fi

      # The same command `make release-check VERSION=…` runs, so the refusal a tagger meets here is
      # the one they could have met before pushing.
      - name: Check the annotation
        run: uv run python tools/release_notes.py --check "$TAG"

      - name: Refuse a tag that is not on the default branch
        # A tag can be pushed from anywhere, so "which branch" is not a property of the push — the
        # question that *is* answerable is whether the tagged commit is in the history `main`
        # names. A version naming a commit nobody deploys is worse than no version.
        run: |
          # **`FETCH_HEAD`, not `origin/main`.** `actions/checkout` configures a refspec for the
          # ref it checked out — here a tag — so `refs/remotes/origin/main` need not exist, and
          # `merge-base` against a ref it cannot resolve exits non-zero: the guard would refuse
          # every release rather than the ones it is for. `FETCH_HEAD` is whatever the fetch on the
          # line above just produced, which is exactly the thing being asked about.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" FETCH_HEAD; then
            echo "::error::$TAG names a commit that is not on main"
            exit 1
          fi

      - name: Refuse a version older than the newest release
        # `latest` would move **backwards**. Releases here go forward only; a backport would need a
        # second moving tag per series, which is a feature and not an oversight (`FRD-137` §6).
        run: |
          newest="$(uv run python tools/release_version.py --current)"
          if [ "$newest" != "$TAG" ]; then
            echo "::error::$TAG is older than $newest; releases go forward only"
            exit 1
          fi

  publish:
    name: Publish versioned images to GHCR
    # Every gate, plus the description check — so a published version is one that six jobs agreed
    # about, on this commit, in this run. The jobs after this one need it, so they wait for all six.
    needs: [python, frontend, clients, stack, browser, described]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # As in `described`: the tag's name only ever reaches a script through `$TAG`.
    env:
      TAG: ${{ github.ref_name }}

    permissions:
      # `packages: write` is what GHCR accepts `GITHUB_TOKEN` for in the repository's own
      # namespace — no personal access token, nothing to configure as a secret. Nothing else here
      # can write: the Release, and the signatures, are the `release` job's.
      contents: read
      packages: write

    # What the later jobs describe and sign: the digests just pushed, never a tag that can move.
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      gateway: ${{ steps.gateway.outputs.digest }}
      management: ${{ steps.management.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}

    steps:
      # The same spelling `tools/release_version.py` accepts — ASCII digits, no leading zero —
      # checked before checkout, so nothing below ever runs with any other name in `$TAG`.
      - name: Refuse a tag name that is not a release version
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the pushed tag is not a release version (vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Name the release
        id: release
        run: |
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # GHCR rejects an upper-case path, and this owner has capitals in it.
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Refuse to republish a version that is already released
        # The tag cannot be the lock any more — it exists before this job starts, by definition. The
        # **GitHub Release** is: re-running a run whose images already landed would otherwise push
        # over a published version, and an image tag that changes under a deployment is the one
        # thing a version number exists to prevent.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released; tag a new version instead"
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One entry per image, built from the same contexts the Compose files name
      # (`deploy/compose/docker-compose.apps.yml`). Three tags each: the version, which never
      # moves and is what a deployment pins; `sha-<commit>`, which ties an image to the commit a
      # rolling update is advancing to (`FRD-127`); and `latest`, for a reader trying it out.
      # `sbom` and `provenance` put BuildKit's SBOM (SPDX) and how the image was built beside it in
      # the registry, as attestations of the digest a deployment pulls (`FRD-148`). **No layer
      # cache**, in either direction: a release builds from its own commit and nothing else.
      - name: Build and push the gateway
        id: gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/aira-gateway:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.owner }}/aira-gateway:sha-${{ github.sha }}
            ghcr.io/${{ steps.release.outputs.owner }}/aira-gateway:latest
          sbom: true
          provenance: mode=max

      - name: Build and push the management backend
        id: management
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: management/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/aira-management:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.owner }}/aira-management:sha-${{ github.sha }}
            ghcr.io/${{ steps.release.outputs.owner }}/aira-management:latest
          sbom: true
          provenance: mode=max

      - name: Build and push the console
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: management/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/aira-frontend:${{ steps.release.outputs.version }}
            ghcr.io/${{ steps.release.outputs.owner }}/aira-frontend:sha-${{ github.sha }}
            ghcr.io/${{ steps.release.outputs.owner }}/aira-frontend:latest
          sbom: true
          provenance: mode=max

  inventory:
    name: Describe what the release contains
    # What the release contains, as CycloneDX files on the Release (`FRD-148`): one per image,
    # scanned back from the registry **by the digest just pushed**, and one of the source's lock
    # files — the console's image holds a compiled bundle in which no scanner finds its npm
    # packages. A document that lists nothing stops the release here. A job of its own because
    # Syft is fetched by a third party's action, and nothing here can write.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}

    permissions:
      # Read only: the packages start private, so Syft has to sign in to read them back.
      contents: read
      packages: read

    steps:
      - name: Refuse a tag name that is not a release version
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the pushed tag is not a release version (vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The release tools need Python and nothing from PyPI.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Describe what the release contains
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          OWNER: ${{ needs.publish.outputs.owner }}
          GATEWAY: ${{ needs.publish.outputs.gateway }}
          MANAGEMENT: ${{ needs.publish.outputs.management }}
          FRONTEND: ${{ needs.publish.outputs.frontend }}
        run: |
          python tools/release_sbom.py "$TAG" --syft "$SYFT" \
            --image "aira-gateway=ghcr.io/$OWNER/aira-gateway@$GATEWAY" \
            --image "aira-management=ghcr.io/$OWNER/aira-management@$MANAGEMENT" \
            --image "aira-frontend=ghcr.io/$OWNER/aira-frontend@$FRONTEND" \
            --source . \
            --out "$RUNNER_TEMP/assets"

      - name: Hand the documents to the release job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-sboms
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release notes, signed
    # After the images, never before, and it is what makes a release legible: the tag's own
    # message, then the commits since the previous release, then the three image references. A
    # failed build therefore leaves a tag with no Release against it — visibly unfinished, rather
    # than a version that silently names nothing.
    needs: [publish, inventory]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}

    permissions:
      # `contents: write` for the GitHub Release. `id-token` and `attestations` sign what it attaches
      # and the three images it names: a Sigstore signature over a statement of which run, commit
      # and workflow made each, kept in GitHub's attestation store (`gh attestation verify`).
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Refuse a tag name that is not a release version
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the pushed tag is not a release version (vX.Y.Z)"
            exit 1
          fi

      # Full history and tags: the notes quote the commits since the previous release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release tools need Python and nothing from PyPI — so nothing from PyPI is installed
      # where the Release can be written.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # **The tag object, which the checkout flattens into a lightweight ref** — see `described`.
      - name: Restore the annotated tag object
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          kind="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$kind" != tag ]; then
            echo "::error::refs/tags/$TAG is a $kind, not an annotated tag"
            exit 1
          fi

      - name: Collect the documents the inventory wrote
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-sboms
          path: ${{ runner.temp }}/assets

      # The OpenCode budget plugin as an archive, attached to the Release: an address that does not
      # move and needs no credentials, for a rollout that puts it on workstations. GitHub's npm
      # registry would need a token even to install a public package. Packed here, from the tagged
      # source, so the file signed below is made where only GitHub's actions run.
      - name: Pack the OpenCode plugin
        env:
          VERSION: ${{ github.ref_name }}
        run: python tools/opencode_plugin_archive.py "$VERSION" --out "$RUNNER_TEMP/assets"

      # **Signed before the Release exists**, so no version is ever downloadable without them. One
      # statement for the files a rollout downloads, one per image by the digest just pushed.
      - name: Sign the files the release attaches
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/*.tar.gz
            ${{ runner.temp }}/assets/*.cdx.json

      - name: Sign the gateway image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.publish.outputs.owner }}/aira-gateway
          subject-digest: ${{ needs.publish.outputs.gateway }}

      - name: Sign the management image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.publish.outputs.owner }}/aira-management
          subject-digest: ${{ needs.publish.outputs.management }}

      - name: Sign the console image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.publish.outputs.owner }}/aira-frontend
          subject-digest: ${{ needs.publish.outputs.frontend }}

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ needs.publish.outputs.owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          owner="$OWNER"
          version="$VERSION"
          # Every file the steps above wrote is attached and named, each beside its checksum — so a
          # document for an image added later is published without a second edit here.
          assets=()
          for file in "$RUNNER_TEMP"/assets/*; do
            [[ "$file" == *.sha256 ]] || assets+=(--asset "$(basename "$file")")
          done
          python tools/release_notes.py "$version" \
            --image "ghcr.io/$owner/aira-gateway:$version" \
            --image "ghcr.io/$owner/aira-management:$version" \
            --image "ghcr.io/$owner/aira-frontend:$version" \
            "${assets[@]}" \
            > "$RUNNER_TEMP/notes.md"
          # **The title comes from the same tool as the body.** It was a second
          # `git tag --format` here, and that one was never checked — so when the tag arrived
          # flattened, the body and the title were both the commit's, and only the body looked
          # like a mistake worth noticing. One place asks Git what the tag says.
          gh release create "$version" \
            --title "$version — $(python tools/release_notes.py --subject "$version")" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/assets/*
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Packages are **private** until made public in each package's settings." \
            >> "$GITHUB_STEP_SUMMARY"
