[project]
name = "aira-gateway"
version = "0.1.0"
description = "AIRA Gateway API — the data plane (FastAPI)."
requires-python = ">=3.14"
dependencies = [
    "aira-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aira_gateway"]
