# The Compose project name, and the network below, both follow `AIRA_STACK` — the same
# variable that prefixes every container. Set it to run a second stack beside the first.
name: ${AIRA_STACK:-aira}

# AIRA local infrastructure: Postgres, Keycloak, Kafka, Vault, Redis, observability.
# The applications are added by `docker-compose.apps.yml`.
#
# Three conventions apply to every service below.
#
# **Every port is published twice, once per address family.** Docker binds per family: publishing
# on `0.0.0.0` leaves IPv6 unserved and publishing on `[::]` leaves IPv4 unserved, because the
# userland proxy opens one socket per entry rather than one dual-stack socket. A browser that
# resolves `localhost` to `::1` otherwise gets `ERR_CONNECTION_RESET` against a stack that looks
# healthy from every other angle.
#
# **Every published port binds to loopback** — `AIRA_BIND_HOST` (default `127.0.0.1`) and
# `AIRA_BIND_HOST6` (default `::1`). Compose's plain `"5432:5432"` would bind `0.0.0.0`, which on
# a laptop on a corporate network means an open Postgres, Redis, Kafka and a dev-mode Vault with a
# published root token. Set both to their wildcards (`0.0.0.0` and `::`) when something outside
# the machine genuinely has to reach the stack — a port forwarder, a VM, another host.
#
# **Every long-running service declares `restart: unless-stopped`**, and every one-shot declares
# `restart: "no"`. Compose's default is `no`, which after a host or daemon restart leaves the
# infrastructure down while the applications come back — a console that answers, two planes that
# answer, and nobody able to log in because Keycloak is not there.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${AIRA_STACK:-aira}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aira-local}
      POSTGRES_DB: ${POSTGRES_DB:-aira}
      # consumed by the init script to provision the Keycloak DB role
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak-local}
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_POSTGRES_PORT:-5432}:5432"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aira} -d ${POSTGRES_DB:-aira}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [aira]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: ${AIRA_STACK:-aira}-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak-local}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # The console's port, resolved here and handed to the realm import.
      #
      # `aira-realm.json` writes its redirect URIs as `${AIRA_CONSOLE_PORT:4200}`, which Keycloak
      # substitutes on import. The whole fallback chain is resolved here rather than in the JSON,
      # because the realm's placeholder syntax takes one name and one default while Compose's
      # takes a chain.
      #
      # `AIRA_CONSOLE_PORT` comes first because **the port Keycloak must know is the one in the
      # browser's address bar**, which is not always the one this stack publishes: a port
      # forwarder, a VM or an SSH tunnel remaps it, and Keycloak compares against what the browser
      # sends. Get this wrong and the console loads while login fails with *"Invalid parameter:
      # redirect_uri"*.
      AIRA_CONSOLE_PORT: ${AIRA_CONSOLE_PORT:-${AIRA_PUBLISH_FRONTEND_PORT:-${AIRA_FRONTEND_PORT:-4200}}}
      # **And the host the browser types.** The realm's redirect URIs pinned `localhost` and
      # `127.0.0.1` and parameterised only the port, so a stack reached from any other machine
      # failed at the redirect — after the operator had already found `AIRA_BIND_HOST` and
      # `AIRA_OIDC_ISSUER`, which is two fixes deep for a third wall. Defaults to `localhost`, so
      # the entry it adds is a duplicate of the first one and nothing changes for a laptop.
      AIRA_CONSOLE_HOST: ${AIRA_CONSOLE_HOST:-localhost}
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_KEYCLOAK_PORT:-8080}:8080"   # Keycloak HTTP
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_KEYCLOAK_PORT:-8080}:8080"   # Keycloak HTTP
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_KEYCLOAK_HEALTH_PORT:-9000}:9000"   # management/health port
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_KEYCLOAK_HEALTH_PORT:-9000}:9000"   # management/health port
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak images ship bash but no curl; use bash /dev/tcp against /health/ready.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [aira]
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: ${AIRA_STACK:-aira}-kafka
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_KAFKA_PORT:-29092}:29092"   # host-facing listener (apps on host use localhost:29092)
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_KAFKA_PORT:-29092}:29092"   # host-facing listener (apps on host use localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # empty host (://:PORT) binds all interfaces without polluting advertised.listeners with 0.0.0.0
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [aira]
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: ${AIRA_STACK:-aira}-schema-registry
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_SCHEMA_REGISTRY_PORT:-8081}:8081"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_SCHEMA_REGISTRY_PORT:-8081}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [aira]
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.18
    container_name: ${AIRA_STACK:-aira}-vault
    cap_add: ["IPC_LOCK"]
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_VAULT_PORT:-8200}:8200"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [aira]
    restart: unless-stopped

  # Shared counter store for rate-limit buckets and budget reservations. Deliberately not
  # persisted: the counters are seeded from Postgres, which stays the system of record.
  #
  # noeviction, not an LRU policy: an evicted budget counter would silently reset and quietly
  # forgive spend. Refusing the write instead surfaces as "Redis unavailable" and takes the
  # decided degradation path (fail open for limits, Postgres fallback for budgets).
  redis:
    image: redis:7.4-alpine
    container_name: ${AIRA_STACK:-aira}-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_REDIS_PORT:-6379}:6379"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aira]
    restart: unless-stopped

  # --- Observability (opt-in via the "observability" profile) ---
  otel-lgtm:
    image: grafana/otel-lgtm:0.30.0
    container_name: ${AIRA_STACK:-aira}-otel-lgtm
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    # A dashboard of our own, provisioned rather than imported by hand (`FRD-615`). The image
    # ships RED-metric dashboards and leaves the drop-in provider commented out in its own
    # `sample.yaml`; without one, somebody who has just switched telemetry on lands on a Grafana
    # with four datasources and no view of their own system.
    volumes:
      - ./grafana/provisioning-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/aira.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/aira:ro
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_GRAFANA_PORT:-3000}:3000"   # Grafana UI
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_GRAFANA_PORT:-3000}:3000"   # Grafana UI
    networks: [aira]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: ${AIRA_STACK:-aira}-otel-collector
    profiles: ["observability"]
    # **Five `--config` flags, always.** The collector merges them, and the last four are the empty
    # fragment until a variable names a real one — so a channel is configuration rather than a
    # compose file of its own, and the base configuration is never copied.
    #
    # One slot switches the **observability** channel off; three configure the **delivery** channel,
    # which varies in ways that do not depend on each other: **where** it is, **how** it is reached
    # (OTLP/HTTP or OTLP/gRPC), and **who** we say we are.
    # A branch would be the alternative and YAML has none — and the last time two of these shared
    # a file, the result was a `headers:` block that was always present, so with no credential
    # configured the collector sent `authorization: ''` on every request. Measured 2026-09-02.
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --config=${AIRA_OTEL_BACKEND_CONFIG:-/etc/otelcol-contrib/noforward.yaml}
      - --config=${AIRA_OTEL_FORWARD_CONFIG:-/etc/otelcol-contrib/noforward.yaml}
      - --config=${AIRA_OTEL_FORWARD_PROTOCOL_CONFIG:-/etc/otelcol-contrib/noforward.yaml}
      - --config=${AIRA_OTEL_FORWARD_AUTH_CONFIG:-/etc/otelcol-contrib/noforward.yaml}
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./otel/collector-nobackend.yaml:/etc/otelcol-contrib/nobackend.yaml:ro
      - ./otel/collector-forward.yaml:/etc/otelcol-contrib/forward.yaml:ro
      - ./otel/collector-forward-grpc.yaml:/etc/otelcol-contrib/forward-grpc.yaml:ro
      - ./otel/collector-forward-auth-header.yaml:/etc/otelcol-contrib/forward-auth-header.yaml:ro
      - ./otel/collector-forward-auth-basic.yaml:/etc/otelcol-contrib/forward-auth-basic.yaml:ro
      - ./otel/collector-forward-auth-oauth2.yaml:/etc/otelcol-contrib/forward-auth-oauth2.yaml:ro
      - ./otel/collector-forward-auth-azure-identity.yaml:/etc/otelcol-contrib/forward-auth-azure-identity.yaml:ro
      - ./otel/collector-noforward.yaml:/etc/otelcol-contrib/noforward.yaml:ro
      # Writable, for `AIRA_OTEL_ARRIVED_FILE=/payload/arrived.json`. Git-ignored, and nothing is
      # written here unless that variable names a path inside it.
      - ./payload:/payload
      # Where a private CA's certificate goes, for `AIRA_OTEL_FORWARD_CA_FILE`. Git-ignored except
      # for its README; empty until somebody puts a `.crt` in it, and the mount costs nothing then.
      - ./otel/ca:/etc/otelcol-contrib/ca:ro
    environment:
      # How much the collector says about what **arrives**: basic | normal | detailed.
      # `normal` is one line per span and is what this stack has always printed.
      AIRA_OTEL_DEBUG_VERBOSITY: ${AIRA_OTEL_DEBUG_VERBOSITY:-normal}
      # And the same thing as OTLP/JSON, for parsing rather than reading. `/dev/null` is off;
      # `/payload/arrived.json` writes to `deploy/compose/payload/` on the host.
      AIRA_OTEL_ARRIVED_FILE: ${AIRA_OTEL_ARRIVED_FILE:-/dev/null}
      # ---- Channel 1: observability — every span, for "was the gateway slow or the model" -----
      #
      # `AIRA_OTEL_BACKEND_CONFIG` is **not** here on purpose, and neither is its delivery
      # counterpart: a `--config` path is substituted by Compose into the command line above, and
      # the collector never reads the variable. Passing it into the container as well would claim
      # the process reads something it does not — which is exactly what
      # `test_compose_passes_the_settings_it_names.py` exists to keep honest.
      #
      # `host:port`, no scheme (OTLP/gRPC). The default is the bundled Grafana; point it at your
      # own Tempo, Jaeger or vendor endpoint and nothing else about the stack changes. It was a
      # literal in `collector-config.yaml` until `FRD-618` — the delivery channel had seven
      # variables and this one had none, which is the asymmetry that made "two channels" untrue in
      # the configuration even after the pipelines were separated.
      AIRA_OTEL_BACKEND_ENDPOINT: ${AIRA_OTEL_BACKEND_ENDPOINT:-otel-lgtm:4317}
      # No TLS at all (plaintext h2c) — right on this network, wrong across a boundary. Set to
      # `false` for anything remote, and give it a CA below if it is behind a private one.
      AIRA_OTEL_BACKEND_PLAINTEXT: ${AIRA_OTEL_BACKEND_PLAINTEXT:-true}
      AIRA_OTEL_BACKEND_INSECURE: ${AIRA_OTEL_BACKEND_INSECURE:-false}
      AIRA_OTEL_BACKEND_CA_FILE: ${AIRA_OTEL_BACKEND_CA_FILE:-}
      # ---- Channel 2: delivery — one record per API access and per model access --------------
      # ---- A second destination beside Grafana (off unless the two above are set) ----------
      #
      # Read only when AIRA_OTEL_FORWARD_CONFIG selects `forward.yaml`; harmless otherwise, which
      # is why they can carry defaults rather than being required.
      # **The fallback is here, not in the fragment.** Compose passes an *empty string* for an
      # unset variable, and an empty string overrides a `${env:…:-default}` in the collector — so
      # the default has to be spelled at this end or it never applies. Measured on 2026-09-02:
      # with the fallback only in `collector-forward.yaml`, switching forwarding on without an
      # endpoint put the collector in `Restarting (1)` for ever, taking Grafana down with it,
      # because one container carries every exporter.
      #
      # `.invalid` never resolves (RFC 2606), so the collector starts, this one exporter fails
      # loudly, and `make otel-status` names it while everything else keeps working.
      AIRA_OTEL_FORWARD_ENDPOINT: ${AIRA_OTEL_FORWARD_ENDPOINT:-http://forward-endpoint-not-set.invalid:4318}
      # **One URL per signal, computed here from the one above.** `otlphttp` given a single
      # `endpoint` appends `/v1/traces`; a destination that puts a route in front of OTLP needs the
      # whole path spelled out, and a different host for metrics than for logs. Azure Monitor —
      # the way telemetry reaches Microsoft Sentinel — is exactly that, so the three are nameable
      # and default to what a plain receiver expects. `FRD-618`.
      AIRA_OTEL_FORWARD_TRACES_ENDPOINT: ${AIRA_OTEL_FORWARD_TRACES_ENDPOINT:-${AIRA_OTEL_FORWARD_ENDPOINT:-http://forward-endpoint-not-set.invalid:4318}/v1/traces}
      AIRA_OTEL_FORWARD_LOGS_ENDPOINT: ${AIRA_OTEL_FORWARD_LOGS_ENDPOINT:-${AIRA_OTEL_FORWARD_ENDPOINT:-http://forward-endpoint-not-set.invalid:4318}/v1/logs}
      AIRA_OTEL_FORWARD_METRICS_ENDPOINT: ${AIRA_OTEL_FORWARD_METRICS_ENDPOINT:-${AIRA_OTEL_FORWARD_ENDPOINT:-http://forward-endpoint-not-set.invalid:4318}/v1/metrics}
      # `json` to read it, `proto` where the receiver insists. The OTLP specification makes protobuf
      # required and JSON optional, so a conformant receiver may take protobuf only — several
      # managed endpoints do. A third value stops the collector at validation.
      AIRA_OTEL_FORWARD_ENCODING: ${AIRA_OTEL_FORWARD_ENCODING:-json}
      # `host:port`, no scheme — the OTLP/gRPC leg, used only when the protocol fragment is
      # selected. gRPC has no per-signal paths, so there is one address rather than three.
      AIRA_OTEL_FORWARD_GRPC_ENDPOINT: ${AIRA_OTEL_FORWARD_GRPC_ENDPOINT:-forward-endpoint-not-set.invalid:4317}
      # No TLS at all (plaintext h2c) — not the same as `_INSECURE`, which keeps the encryption and
      # stops checking the certificate. For a receiver on this network, not across a boundary.
      AIRA_OTEL_FORWARD_GRPC_PLAINTEXT: ${AIRA_OTEL_FORWARD_GRPC_PLAINTEXT:-false}
      # gzip | none | zstd | snappy. `none` is for a receiver that does not unwrap gzip — the
      # symptom otherwise is a 400 about a malformed payload, which reads as *our telemetry is wrong*.
      AIRA_OTEL_FORWARD_COMPRESSION: ${AIRA_OTEL_FORWARD_COMPRESSION:-gzip}
      # ---- Credentials, read only by the auth fragment that is selected ---------------------
      #
      # The header **name** is a variable because `Authorization` is what a minority of receivers
      # use: `x-api-key`, `api-key`, `DD-API-KEY`, `X-Honeycomb-Team` are all in the field.
      AIRA_OTEL_FORWARD_AUTH_HEADER: ${AIRA_OTEL_FORWARD_AUTH_HEADER:-authorization}
      AIRA_OTEL_FORWARD_AUTHORIZATION: ${AIRA_OTEL_FORWARD_AUTHORIZATION:-}
      AIRA_OTEL_FORWARD_BASIC_USERNAME: ${AIRA_OTEL_FORWARD_BASIC_USERNAME:-}
      AIRA_OTEL_FORWARD_BASIC_PASSWORD: ${AIRA_OTEL_FORWARD_BASIC_PASSWORD:-}
      # OAuth2 client credentials (RFC 6749 §4.4) — Keycloak, Okta, Auth0, Ping, Entra. One
      # fragment for every identity provider an installation already runs, rather than one per
      # vendor. The secret is long-lived; the token it buys is not, which is the point.
      AIRA_OTEL_FORWARD_OAUTH_TOKEN_URL: ${AIRA_OTEL_FORWARD_OAUTH_TOKEN_URL:-}
      AIRA_OTEL_FORWARD_OAUTH_CLIENT_ID: ${AIRA_OTEL_FORWARD_OAUTH_CLIENT_ID:-}
      AIRA_OTEL_FORWARD_OAUTH_CLIENT_SECRET: ${AIRA_OTEL_FORWARD_OAUTH_CLIENT_SECRET:-}
      AIRA_OTEL_FORWARD_OAUTH_SCOPES: ${AIRA_OTEL_FORWARD_OAUTH_SCOPES:-[]}
      AIRA_OTEL_FORWARD_OAUTH_CA_FILE: ${AIRA_OTEL_FORWARD_OAUTH_CA_FILE:-}
      # The one credential shape OAuth2 cannot express: a platform identity with no secret.
      AIRA_OTEL_FORWARD_AZURE_CLIENT_ID: ${AIRA_OTEL_FORWARD_AZURE_CLIENT_ID:-}
      AIRA_OTEL_FORWARD_AZURE_SCOPE: ${AIRA_OTEL_FORWARD_AZURE_SCOPE:-https://monitor.azure.com/.default}
      # ---- TLS ------------------------------------------------------------------------------
      AIRA_OTEL_FORWARD_INSECURE: ${AIRA_OTEL_FORWARD_INSECURE:-false}
      # A private CA's certificate, inside the container: `/etc/otelcol-contrib/ca/<file>.crt`.
      # Empty means the system trust store. The alternative was `_INSECURE=true`, which answers a
      # missing root by not checking any of them.
      AIRA_OTEL_FORWARD_CA_FILE: ${AIRA_OTEL_FORWARD_CA_FILE:-}
      # And the other direction: mutual TLS, where the receiver authenticates *us* by certificate
      # instead of — or as well as — a credential in a header.
      AIRA_OTEL_FORWARD_CLIENT_CERT_FILE: ${AIRA_OTEL_FORWARD_CLIENT_CERT_FILE:-}
      AIRA_OTEL_FORWARD_CLIENT_KEY_FILE: ${AIRA_OTEL_FORWARD_CLIENT_KEY_FILE:-}
      # Polite rather than fast, because the destination is usually one somebody is trying for the
      # first time — see `collector-forward.yaml` for what each is measured to do.
      AIRA_OTEL_FORWARD_BATCH_SECONDS: ${AIRA_OTEL_FORWARD_BATCH_SECONDS:-10s}
      AIRA_OTEL_FORWARD_BATCH_SIZE: ${AIRA_OTEL_FORWARD_BATCH_SIZE:-8192}
      AIRA_OTEL_FORWARD_CONSUMERS: ${AIRA_OTEL_FORWARD_CONSUMERS:-1}
      AIRA_OTEL_FORWARD_QUEUE: ${AIRA_OTEL_FORWARD_QUEUE:-5000}
      AIRA_OTEL_FORWARD_RETRY_INITIAL: ${AIRA_OTEL_FORWARD_RETRY_INITIAL:-5s}
    extra_hosts:
      # **A destination outside this network needs a name this container can resolve**, and the
      # two entries below are how, without touching DNS.
      #
      # `host.docker.internal` for an endpoint port-forwarded to the machine this stack runs on.
      # Measured on 2026-09-02: without this line the embedded resolver answers `fe80::1` — an
      # IPv6 link-local address the collector cannot reach — and every forward failed with `EOF`
      # after the connection appeared to open. `host-gateway` pins it to the address that works.
      - "host.docker.internal:host-gateway"
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      # The collector's own counters — what it **accepted**, and what it delivered onward. The one
      # hop `AIRA_DEBUG_INTEGRATIONS=otel` cannot see from inside a service, because an exporter
      # reads `resp.ok` and an OTLP 200 can still say half the batch was dropped. `make otel-status`
      # reads this; published like everything else so you can curl it yourself.
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OTLP_METRICS_PORT:-8889}:8889"   # collector metrics
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OTLP_METRICS_PORT:-8889}:8889"   # collector metrics
    depends_on:
      otel-lgtm:
        condition: service_started
    networks: [aira]
    restart: unless-stopped

  # --- What the second destination receives, on a page (opt-in via the "debug" profile) ---
  #
  # A standing-in SIEM: an ordinary OTLP/HTTP receiver that keeps the last few hundred batches and
  # renders them. `make otlp-inspector` starts it and prints the address. `FRD-618`.
  #
  # **Not part of any other profile, and never published beyond this machine.** It has no
  # authentication, and what it holds — `aira.subject`, `aira.source_ip`, whatever a log line
  # carried — is the content `FRD-505` puts behind a role check and a retention clock. It is a
  # thing you start while wiring a destination up, and stop again.
  #
  # The script is mounted rather than baked into an image: it is stdlib-only Python by design
  # (`tools/otlp_inspector.py` says why), so there is nothing to install, and an edit is a restart
  # rather than a rebuild — which is what a debugging tool should cost.
  otlp-inspector:
    image: python:3.14-slim
    container_name: ${AIRA_STACK:-aira}-otlp-inspector
    profiles: ["debug"]
    command: ["python", "/app/otlp_inspector.py"]
    volumes:
      - ../../tools/otlp_inspector.py:/app/otlp_inspector.py:ro
    environment:
      # Batches, not records: one batch carries up to `AIRA_OTEL_FORWARD_BATCH_SIZE` of them.
      AIRA_OTLP_INSPECTOR_KEEP: ${AIRA_OTLP_INSPECTOR_KEEP:-200}
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OTLP_INSPECTOR_PORT:-4319}:4318"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OTLP_INSPECTOR_PORT:-4319}:4318"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4318/healthz').read()"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aira]
    restart: unless-stopped

  # --- A real model, locally (opt-in via the "verify" profile) ---
  #
  # Not part of the reference stack on purpose: it exists to exercise the governed path against
  # a real model, not to serve traffic. The endpoint is unauthenticated and must stay on this
  # network.
  ollama:
    image: ollama/ollama:latest
    container_name: ${AIRA_STACK:-aira}-ollama
    # `demo` as well as `verify`: a demo whose models are a mock shows the screens but
    # not the point — the numbers on the spend report have to come from something that actually
    # counted tokens, or the walkthrough is a slideshow.
    profiles: ["verify", "demo"]
    environment:
      # With the default single slot, a client issuing two requests at once has the second waiting
      # for the whole of the first — and a coding agent issues several per instruction. On CPU that
      # turns a queue into a read timeout upstream, which reads like a broken gateway and is not.
      OLLAMA_NUM_PARALLEL: "2"
      # Keep the model resident between turns — but not for half an hour. With two slots, a long
      # keep-alive pins two models in RAM for the rest of the session and starves everything else
      # on the machine. Ollama's own default of 5m is the right trade here.
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OLLAMA_PORT:-11434}:11434"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      # `ollama list` answers as soon as the server is up and — unlike a generation — does **not**
      # load a model — a probe that wakes a scaled-to-zero endpoint turns every
      # health check into a cold start, which for a paid endpoint is also a billable call.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [aira]
    restart: unless-stopped

  # Pulls the models the demo declares. Separate from the server so the server's health check stays
  # honest — a container that is "healthy" only once a multi-hundred-megabyte download finishes
  # would make every restart look like a hang.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ${AIRA_STACK:-aira}-ollama-pull
    profiles: ["verify", "demo"]
    entrypoint: ["/bin/sh", "-c"]
    # Retried, and loud about what a final failure means. A model pull is a large download from a
    # registry a corporate network may block and that fails transiently on its own; a bare
    # non-zero exit here is reported by Compose against the *seed*, naming a service that never
    # ran and saying nothing about the download. Failing is still correct — a model nobody pulled
    # must not be catalogued, because a catalog entry is a promise — but the reason is legible.
    command:
      - |
        set -e
        for m in ${AIRA_DEMO_CHAT_MODEL:-qwen3:0.6b} ${AIRA_DEMO_EMBED_MODEL:-all-minilm}; do
          echo "pulling $$m"
          n=0
          until ollama pull "$$m"; do
            n=$$((n + 1))
            if [ "$$n" -ge 3 ]; then
              echo ""
              echo "could not pull '$$m' after 3 attempts."
              echo "The demo needs a local model: without one there is nothing to serve, and a"
              echo "catalogued model nobody can reach fails every request made against it."
              echo "Most likely the registry is unreachable from here — check that"
              echo "registry.ollama.ai is allowed, or pre-pull the model into the aira_ollama-models"
              echo "volume and run 'make showcase' again."
              exit 1
            fi
            echo "pull failed, retrying ($$n/3)…"
            sleep 5
          done
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [aira]
    restart: "no"

volumes:
  pgdata:
  kafka-data:
  # Model layers are hundreds of megabytes and come from a registry a locked-down network denies
  # by default. A named volume means one pull per machine rather than one per run.
  ollama-models:

networks:
  aira:
    # **Named after the stack, not after the product.** `AIRA_STACK` already prefixes every
    # container name so that a second stack can run beside the first — a demo next to a staging
    # instance, a cold-start probe next to a working one. It did not reach here, and a fixed
    # network name is shared by every project on the machine: both stacks join one bridge, and
    # `postgres`, `kafka` and `keycloak` each resolve to whichever container answers first.
    #
    # The failure is silent and total. A second stack comes up healthy, its own database stays
    # empty, and it reads and writes the *first* stack's Postgres — measured here, with a seed
    # that reported success against a database that was not its own.
    name: ${AIRA_STACK:-aira}
    driver: bridge
