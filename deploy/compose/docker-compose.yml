name: aira

# AIRA local infrastructure stack (FRD-000). Business services (gateway, management)
# and observability (FRD-001) are added in later slices/FRDs.
#
# **Both address families, or a browser that resolves `localhost` to `::1` gets nothing.**
#
# Docker binds per family: publishing on `0.0.0.0` leaves IPv6 unserved, and publishing on `[::]`
# leaves IPv4 unserved — measured here, `bindv6only=0` notwithstanding, because the userland proxy
# opens one socket per entry rather than one dual-stack socket. So every port is published twice.
#
# Found on 2026-08-19 from a symptom that pointed everywhere but here: the console was unreachable
# with `ERR_CONNECTION_RESET` while `docker compose ps` was green, `curl localhost:4200` answered
# 200 from inside, and nginx's log showed **no request at all** — because the browser reached the
# forwarder over `::1`, the forwarder connected into a machine with fourteen IPv4 listeners and
# zero IPv6 ones, and the connection was reset before any of our code saw it. A reset is not a
# refusal: something accepted, so every diagnosis started at the wrong end.
#
# `AIRA_BIND_HOST6` mirrors `AIRA_BIND_HOST` and defaults to `::1` for the same reason that one
# defaults to `127.0.0.1` — this file publishes credentials, and loopback is where they belong.
# Set both to their wildcards (`0.0.0.0` and `::`) when something outside the machine has to reach
# the stack: a sandbox port-forwarder, a VM, another host.
# **Every published port binds to loopback** (`AIRA_BIND_HOST`, default `127.0.0.1`).
#
# Compose's `"5432:5432"` binds `0.0.0.0`, so this stack put Postgres, Redis, Kafka and a Vault in
# dev mode with the root token `root` on every interface of whichever machine ran it — with the
# credentials that are published in this repository. On a laptop on a corporate network that is an
# open database port, not a local development stack. Nothing about the stack changes: the host
# still reaches everything on `localhost`, which is what `.env.example`, the Makefile and the docs
# all use.
#
# A deployment that genuinely needs these reachable from elsewhere sets `AIRA_BIND_HOST=0.0.0.0`
# and has thereby said so once, out loud — which is the same shape as `AIRA_DEMO_MODE` and
# `AIRA_ALLOWED_REGIONS`: a default that is safe, and an override that is a decision.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${AIRA_STACK:-aira}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aira-local}
      POSTGRES_DB: ${POSTGRES_DB:-aira}
      # consumed by the init script to provision the Keycloak DB role
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak-local}
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_POSTGRES_PORT:-5432}:5432"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aira} -d ${POSTGRES_DB:-aira}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [aira]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: ${AIRA_STACK:-aira}-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak-local}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # **The console's port, resolved once and handed to the realm import.**
      #
      # `aira-realm.json` pins the console's redirect URIs and web origins, and it used to pin them
      # to a literal `4200`. That made `AIRA_PUBLISH_FRONTEND_PORT` a knob that could not actually
      # be turned: moving the console to dodge a port collision left it loading fine and login
      # failing with *"Invalid parameter: redirect_uri"*, which names the realm and not the port.
      # A configurable port that silently breaks authentication is worse than a fixed one.
      #
      # Keycloak substitutes `${VAR:default}` when importing a realm — measured against 26.1
      # before this was written, not assumed. The **whole fallback chain is resolved here** rather
      # than in the JSON, because the realm's placeholder syntax takes one name and one default
      # while Compose's takes a chain, and two half-expressions of one rule is how they drift.
      # `AIRA_CONSOLE_PORT` first, because **the port Keycloak must know is the one in the
      # browser's address bar**, and that is not always the one this stack publishes. A port
      # forwarder in front of the machine — `sbx ports … --publish 14200:4200`, a VM, an SSH
      # tunnel — remaps it: the container serves 4200, the browser says 14200, and Keycloak
      # compares against what the browser sends. Tying the realm to the published port alone was
      # right for the ordinary case and wrong for every forwarded one, which is the case somebody
      # reaches for precisely when another system already holds the port.
      AIRA_CONSOLE_PORT: ${AIRA_CONSOLE_PORT:-${AIRA_PUBLISH_FRONTEND_PORT:-${AIRA_FRONTEND_PORT:-4200}}}
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_KEYCLOAK_PORT:-8080}:8080"   # Keycloak HTTP
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_KEYCLOAK_PORT:-8080}:8080"   # Keycloak HTTP
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_KEYCLOAK_HEALTH_PORT:-9000}:9000"   # management/health port
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_KEYCLOAK_HEALTH_PORT:-9000}:9000"   # management/health port
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak images ship bash but no curl; use bash /dev/tcp against /health/ready.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [aira]

  kafka:
    image: apache/kafka:3.9.0
    container_name: ${AIRA_STACK:-aira}-kafka
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_KAFKA_PORT:-29092}:29092"   # host-facing listener (apps on host use localhost:29092)
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_KAFKA_PORT:-29092}:29092"   # host-facing listener (apps on host use localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # empty host (://:PORT) binds all interfaces without polluting advertised.listeners with 0.0.0.0
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [aira]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: ${AIRA_STACK:-aira}-schema-registry
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_SCHEMA_REGISTRY_PORT:-8081}:8081"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_SCHEMA_REGISTRY_PORT:-8081}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [aira]

  vault:
    image: hashicorp/vault:1.18
    container_name: ${AIRA_STACK:-aira}-vault
    cap_add: ["IPC_LOCK"]
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_VAULT_PORT:-8200}:8200"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [aira]

  # Shared counter store for rate-limit buckets and budget reservations (ADR-0008 / FRD-405).
  # Deliberately not persisted: these counters are seeded from Postgres, which stays the system
  # of record, and a bucket outlives its window by nothing worth writing to disk.
  #
  # noeviction, not an LRU policy: an evicted budget counter would silently reset and quietly
  # forgive spend. Refusing the write instead surfaces as "Redis unavailable" and takes the
  # decided degradation path (fail open for limits, Postgres fallback for budgets).
  redis:
    image: redis:7.4-alpine
    container_name: ${AIRA_STACK:-aira}-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_REDIS_PORT:-6379}:6379"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aira]

  # --- Observability (opt-in via the "observability" profile; ADR-0004 / FRD-001) ---
  otel-lgtm:
    image: grafana/otel-lgtm:0.30.0
    container_name: ${AIRA_STACK:-aira}-otel-lgtm
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_GRAFANA_PORT:-3000}:3000"   # Grafana UI
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_GRAFANA_PORT:-3000}:3000"   # Grafana UI
    networks: [aira]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: ${AIRA_STACK:-aira}-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      otel-lgtm:
        condition: service_started
    networks: [aira]

  # --- A real model, locally (opt-in via the "verify" profile; FRD-123) ---
  #
  # Not part of the reference stack, and that is deliberate. Its purpose is to make the whole
  # governed path — stored prompts, real token counts, cost, roles, budgets — observable against
  # something that did not agree with us by construction. A verification tool that came up with
  # `make up` would eventually serve production traffic.
  #
  # The endpoint is unauthenticated: it must stay on this network.
  ollama:
    image: ollama/ollama:latest
    container_name: ${AIRA_STACK:-aira}-ollama
    # `demo` as well as `verify` (`FRD-130`): a demo whose models are a mock shows the screens but
    # not the point — the numbers on the spend report have to come from something that actually
    # counted tokens, or the walkthrough is a slideshow.
    profiles: ["verify", "demo"]
    environment:
      # Measured on 2026-08-08 while wiring up a coding assistant (`FRD-131`/`FRD-132`): with the
      # default single slot, a client that issues two requests at once has the second waiting for
      # the whole of the first — and an agent issues several per instruction. On CPU that turns a
      # queue into a read timeout upstream, which reads like a broken gateway and is not one.
      OLLAMA_NUM_PARALLEL: "2"
      # Keep the model resident between turns — but **not for half an hour**. The first attempt
      # set 30m, and with two slots that pinned two models (7.8 GB) in a 15 GB box for the rest of
      # the session: load average 103, 118 MB free, and the *frontend test suite* started timing
      # out at 5 seconds a case. A caching setting made a test suite fail, which is the kind of
      # coupling nobody looks for. Ollama's own default is 5m and it is the right trade here.
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_OLLAMA_PORT:-11434}:11434"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      # `ollama list` answers as soon as the server is up and — unlike a generation — does **not**
      # load a model. `ADR-0012` §5: a probe that wakes a scaled-to-zero endpoint turns every
      # health check into a cold start, which for a paid endpoint is also a billable call.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [aira]

  # Pulls the models the demo declares. Separate from the server so the server's health check stays
  # honest — a container that is "healthy" only once a multi-hundred-megabyte download finishes
  # would make every restart look like a hang.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ${AIRA_STACK:-aira}-ollama-pull
    profiles: ["verify", "demo"]
    entrypoint: ["/bin/sh", "-c"]
    # Retried, and loud about what a final failure means.
    #
    # A model pull is a large download from a registry that a corporate network may not allow and
    # that fails transiently on its own. One `ollama pull` with `set -e` turned any of that into a
    # bare non-zero exit — and because the seed waits on this service, compose then reported
    # `service "management-seed" didn't complete successfully`, naming a service that never ran
    # and saying nothing about the download that actually failed.
    #
    # Failing is still right: `FRD-130` records why a model that was not pulled must not be
    # catalogued — every request against it would fail, and a catalog entry is a promise. What
    # changes is that the reason is legible and a flaky minute does not end the demo.
    command:
      - |
        set -e
        for m in ${AIRA_DEMO_CHAT_MODEL:-qwen3:0.6b} ${AIRA_DEMO_EMBED_MODEL:-all-minilm}; do
          echo "pulling $$m"
          n=0
          until ollama pull "$$m"; do
            n=$$((n + 1))
            if [ "$$n" -ge 3 ]; then
              echo ""
              echo "could not pull '$$m' after 3 attempts."
              echo "The demo needs a local model: without one there is nothing to serve, and a"
              echo "catalogued model nobody can reach fails every request made against it."
              echo "Most likely the registry is unreachable from here — check that"
              echo "registry.ollama.ai is allowed, or pre-pull the model into the aira_ollama-models"
              echo "volume and run 'make showcase' again."
              exit 1
            fi
            echo "pull failed, retrying ($$n/3)…"
            sleep 5
          done
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [aira]
    restart: "no"

volumes:
  pgdata:
  kafka-data:
  # Model layers are hundreds of megabytes and come from a registry a locked-down network denies
  # by default. A named volume means one pull per machine rather than one per run.
  ollama-models:

networks:
  aira:
    name: aira
    driver: bridge
