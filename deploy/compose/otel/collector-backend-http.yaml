# The observability channel over OTLP/HTTP instead of OTLP/gRPC — which is what makes
# AIRA_OTEL_BACKEND_ENCODING reachable, since OTLP/gRPC is protobuf by definition.
#
#     AIRA_OTEL_BACKEND_PROTOCOL_CONFIG=/etc/otelcol-contrib/backend-http.yaml
#     AIRA_OTEL_BACKEND_HTTP_ENDPOINT=https://tempo.internal:4318
#
# It only moves the base pipelines onto `otlphttp/backend`. The lists are complete because a merged
# list replaces: `debug` and `file/arrived` are what `make otel-arrivals` and the arrivals file
# read. `AIRA_OTEL_BACKEND_CONFIG=…/nobackend.yaml` is merged after this and outranks it.

service:
  pipelines:
    traces:
      exporters: [otlphttp/backend, debug, file/arrived]
    metrics:
      exporters: [otlphttp/backend, debug, file/arrived]
    logs:
      exporters: [otlphttp/backend, debug, file/arrived]
