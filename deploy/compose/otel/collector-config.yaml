# OpenTelemetry Collector config (FRD-001).
#
# Apps export OTLP here, and this collector feeds **two independent channels** (`FRD-618`):
#
#   observability  every span, metric and log — "was the gateway slow or was the model slow"
#                  configured here, by AIRA_OTEL_BACKEND_*
#   delivery       one record per API access and per model access, for whoever consumes that
#                  elsewhere — configured by AIRA_OTEL_FORWARD_*, in `collector-forward.yaml`
#
# Neither is a branch of the other: the delivery fragment adds pipelines of its own and names
# nothing in this file, so what is below is what runs whether forwarding is on or off. Swapping
# either backend is configuration; app code is unaffected either way (ADR-0004).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: collector
        value: aira-otel-collector
        action: insert
  batch: {}

exporters:
  # **The observability channel's destination.** `host:port`, no scheme — OTLP/gRPC.
  #
  # It was the literal `otel-lgtm:4317` until `FRD-618`, which is the bundled Grafana and nobody
  # else's. So an installation with its own Tempo, Jaeger or vendor endpoint had to edit a file
  # this repository ships, while the *other* channel had seven variables and a chapter of
  # documentation. That asymmetry was the last of the subordination: one channel was the product's,
  # the other was an addition to it.
  #
  # The default is still the bundled backend, so the demo stack is unchanged.
  #
  # **Named `backend`, not `lgtm`.** The old name said which product was on the other end, which
  # stopped being true the moment this became a variable — and a name that lies about a
  # configurable thing is worse than a vague one. Earlier DEVLOG entries quote the old name; that
  # is what they measured.
  otlp/backend:
    endpoint: ${env:AIRA_OTEL_BACKEND_ENDPOINT:-otel-lgtm:4317}
    tls:
      # **`insecure` is no TLS at all** — plaintext h2c — which is right for a backend on this
      # private network and wrong for anything across a boundary. `insecure_skip_verify` is the
      # other thing: TLS kept, certificate unchecked. The bundled Grafana is the first case.
      insecure: ${env:AIRA_OTEL_BACKEND_PLAINTEXT:-true}
      insecure_skip_verify: ${env:AIRA_OTEL_BACKEND_INSECURE:-false}
      # A private CA, from the same mount as the delivery channel's: `deploy/compose/otel/ca/`.
      ca_file: ${env:AIRA_OTEL_BACKEND_CA_FILE}
  # **What arrives, in the collector's own words.** `docker logs <stack>-otel-collector`, or
  # `make otel-arrivals`. Three levels, and the difference matters:
  #
  #   basic     counts only — "3 spans" and nothing about them
  #   normal    one line per span: name, trace id, span id, attributes  (the default)
  #   detailed  every attribute, event, link and resource field, indented
  #
  # This is what **arrived**, after the processors above and before anything is forwarded. It is
  # not what was delivered onward — that is `make otel-status`, and the two are different
  # questions that a green log cannot tell apart.
  debug:
    verbosity: ${env:AIRA_OTEL_DEBUG_VERBOSITY}

  # **The same thing as OTLP/JSON**, for handing to whoever has to parse it rather than read it.
  #
  # The path is the switch: a collector pipeline is a static list, so this is always present and
  # writes to `/dev/null` until `AIRA_OTEL_ARRIVED_FILE` names somewhere else. `/dev/stdout` works
  # for a look, and **mangles anything large** — Docker's json-file driver cuts at a 16 KiB
  # boundary, measured: a 49 692-character document came back truncated at 48 KiB and would not
  # parse. A file under `deploy/compose/payload/` comes out whole, however big.
  file/arrived:
    path: ${env:AIRA_OTEL_ARRIVED_FILE}
    format: json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/backend, debug, file/arrived]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      # `debug` here too. Metrics were the one signal nothing could be seen arriving on, which is
      # an asymmetry rather than a decision — and the signal whose absence is hardest to notice,
      # because a metric that never arrives looks exactly like a metric whose value did not change.
      exporters: [otlp/backend, debug, file/arrived]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/backend, debug, file/arrived]
  telemetry:
    logs:
      level: info
    metrics:
      # **The collector's own figures, and the only thing in this stack that says a batch was
      # accepted rather than merely answered.**
      #
      # `otelcol_receiver_accepted_spans` against `otelcol_receiver_refused_spans` is the hop the
      # applications cannot see: their exporter returns `SUCCESS` on any 2xx, and an OTLP 200 can
      # carry a `partial_success` body saying half the batch was dropped. `otelcol_exporter_sent_*`
      # against `otelcol_exporter_send_failed_*` is the hop after that.
      #
      # This lived only in `collector-config.lab.yaml` until 2026-09-02, so on the reference stack
      # there was no way at all to answer *did it arrive* — which is what somebody watching
      # `AIRA_DEBUG_INTEGRATIONS=otel` asks the moment they see their first line. `make otel-status`
      # reads these; the port is published so you can too.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
