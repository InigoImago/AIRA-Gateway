# OpenTelemetry Collector, base configuration (FRD-001, ADR-0004).
#
# The applications export OTLP here. This file is the observability channel (AIRA_OTEL_BACKEND_*):
# every span, metric and log to a trace backend. The delivery channel (AIRA_OTEL_FORWARD_*) is
# `collector-forward.yaml`, merged on top; it adds pipelines of its own and names nothing in this
# file, so this runs the same whether it is merged or not (FRD-618).
#
# Fragments are merged in the order of the `--config` flags in docker-compose.yml: a map merges, a
# list replaces. The variables are a closed core with the same names on both channels (FRD-620);
# anything beyond it is a recipe in `recipes/` or an installation's fragment in `custom/`
# (ADR-0024).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# The header credential of each channel, defined here and started below so that no fragment owns
# `service::extensions`: a merged list replaces, and a second fragment naming it silently leaves
# only its own extensions running. `headers_setter` because the header name is a variable, and
# `${env:…}` is substituted in values, not in keys. It refuses an empty value, so the fallback is
# the name of the missing variable — a fragment selected without a value sends that, and the
# receiver quotes it back.
extensions:
  headers_setter/backend:
    headers:
      - action: upsert
        key: ${env:AIRA_OTEL_BACKEND_AUTH_HEADER:-authorization}
        value: ${env:AIRA_OTEL_BACKEND_AUTHORIZATION:-AIRA_OTEL_BACKEND_AUTHORIZATION-is-not-set}
  headers_setter/forward:
    headers:
      - action: upsert
        key: ${env:AIRA_OTEL_FORWARD_AUTH_HEADER:-authorization}
        value: ${env:AIRA_OTEL_FORWARD_AUTHORIZATION:-AIRA_OTEL_FORWARD_AUTHORIZATION-is-not-set}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: collector
        value: aira-otel-collector
        action: insert
  # The observability channel's own batching; the delivery pipelines use `batch/siem`. The defaults
  # are the collector's. One variable sets both sizes: when to flush, and where to split a batch
  # that arrives larger.
  batch:
    timeout: ${env:AIRA_OTEL_BACKEND_BATCH_SECONDS:-200ms}
    send_batch_size: ${env:AIRA_OTEL_BACKEND_BATCH_SIZE:-8192}
    send_batch_max_size: ${env:AIRA_OTEL_BACKEND_BATCH_SIZE:-8192}

exporters:
  # Both transports are defined always and the pipelines choose one: an exporter is validated even
  # when no pipeline uses it, so a fragment never introduces one, and a credential fragment attaches
  # to both because it cannot know which is in play.
  #
  # OTLP/gRPC, the default: `host:port`, no scheme. `insecure` is no TLS at all — right for the
  # bundled Grafana on this network — and `insecure_skip_verify` keeps TLS but skips the check.
  otlp/backend:
    endpoint: ${env:AIRA_OTEL_BACKEND_ENDPOINT:-otel-lgtm:4317}
    tls:
      insecure: ${env:AIRA_OTEL_BACKEND_PLAINTEXT:-true}
      insecure_skip_verify: ${env:AIRA_OTEL_BACKEND_INSECURE:-false}
      ca_file: ${env:AIRA_OTEL_BACKEND_CA_FILE}
      cert_file: ${env:AIRA_OTEL_BACKEND_CLIENT_CERT_FILE}
      key_file: ${env:AIRA_OTEL_BACKEND_CLIENT_KEY_FILE}
    compression: ${env:AIRA_OTEL_BACKEND_COMPRESSION:-gzip}
    sending_queue:
      enabled: true
      num_consumers: ${env:AIRA_OTEL_BACKEND_CONSUMERS:-10}
      queue_size: ${env:AIRA_OTEL_BACKEND_QUEUE:-1000}
    retry_on_failure:
      enabled: true
      initial_interval: ${env:AIRA_OTEL_BACKEND_RETRY_INITIAL:-5s}
      max_interval: 60s
      max_elapsed_time: 300s

  # OTLP/HTTP, selected by `backend-http.yaml`. The collector appends `/v1/<signal>` to the
  # endpoint; a receiver with another route is a recipe that sets `traces_endpoint` and its
  # siblings. Only this transport has an encoding (OTLP/gRPC is protobuf), and an invalid value
  # stops the collector at validation — deliberately, since it is typed on purpose, unlike an
  # endpoint, which gets forgotten. Over HTTP the scheme is the TLS switch.
  otlphttp/backend:
    endpoint: ${env:AIRA_OTEL_BACKEND_HTTP_ENDPOINT:-http://otel-lgtm:4318}
    encoding: ${env:AIRA_OTEL_BACKEND_ENCODING:-json}
    compression: ${env:AIRA_OTEL_BACKEND_COMPRESSION:-gzip}
    tls:
      insecure_skip_verify: ${env:AIRA_OTEL_BACKEND_INSECURE:-false}
      ca_file: ${env:AIRA_OTEL_BACKEND_CA_FILE}
      cert_file: ${env:AIRA_OTEL_BACKEND_CLIENT_CERT_FILE}
      key_file: ${env:AIRA_OTEL_BACKEND_CLIENT_KEY_FILE}
    sending_queue:
      enabled: true
      num_consumers: ${env:AIRA_OTEL_BACKEND_CONSUMERS:-10}
      queue_size: ${env:AIRA_OTEL_BACKEND_QUEUE:-1000}
    retry_on_failure:
      enabled: true
      initial_interval: ${env:AIRA_OTEL_BACKEND_RETRY_INITIAL:-5s}
      max_interval: 60s
      max_elapsed_time: 300s

  # What arrived, in the collector's own words (`make otel-arrivals`): basic · normal · detailed.
  # After the processors and before anything is forwarded; delivery is `make otel-status`.
  debug:
    verbosity: ${env:AIRA_OTEL_DEBUG_VERBOSITY}

  # The same as OTLP/JSON, to parse rather than read. The path is the switch: `/dev/null` until
  # AIRA_OTEL_ARRIVED_FILE names a file. `/dev/stdout` truncates large documents at Docker's 16 KiB
  # log-line limit.
  file/arrived:
    path: ${env:AIRA_OTEL_ARRIVED_FILE}
    format: json

service:
  # The one list of extensions. No fragment names it; a recipe that brings an extension restates it
  # in full, keeping these (ADR-0024).
  extensions:
    - headers_setter/backend
    - headers_setter/forward
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/backend, debug, file/arrived]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/backend, debug, file/arrived]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/backend, debug, file/arrived]
  telemetry:
    logs:
      level: info
    metrics:
      # The collector's own counters: accepted against refused, sent against failed. The only place
      # a partial success shows, since an application's exporter reads the status and drops the
      # body. `make otel-status` reads them; the port is published.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
