# OpenTelemetry Collector config (FRD-001).
# Apps export OTLP here; the collector forwards to Grafana otel-lgtm. Swapping the
# backend is a change to the exporter below only — app code is unaffected (ADR-0004).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: collector
        value: aira-otel-collector
        action: insert
  batch: {}

exporters:
  otlp_grpc/lgtm:
    endpoint: otel-lgtm:4317
    tls:
      insecure: true
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/lgtm, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/lgtm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/lgtm, debug]
  telemetry:
    logs:
      level: info
    metrics:
      # **The collector's own figures, and the only thing in this stack that says a batch was
      # accepted rather than merely answered.**
      #
      # `otelcol_receiver_accepted_spans` against `otelcol_receiver_refused_spans` is the hop the
      # applications cannot see: their exporter returns `SUCCESS` on any 2xx, and an OTLP 200 can
      # carry a `partial_success` body saying half the batch was dropped. `otelcol_exporter_sent_*`
      # against `otelcol_exporter_send_failed_*` is the hop after that.
      #
      # This lived only in `collector-config.lab.yaml` until 2026-09-02, so on the reference stack
      # there was no way at all to answer *did it arrive* — which is what somebody watching
      # `AIRA_DEBUG_INTEGRATIONS=otel` asks the moment they see their first line. `make otel-status`
      # reads these; the port is published so you can too.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
