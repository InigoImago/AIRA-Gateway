# A credential in a header on the delivery channel, under whichever name the receiver wants:
# `authorization`, `x-api-key`, `DD-API-KEY`, `X-Honeycomb-Team`, …
#
#     AIRA_OTEL_FORWARD_AUTH_CONFIG=/etc/otelcol-contrib/forward-auth-header.yaml
#     AIRA_OTEL_FORWARD_AUTH_HEADER=x-api-key           # default: authorization
#     AIRA_OTEL_FORWARD_AUTHORIZATION=…                 # sent verbatim, scheme and all
#
# HTTP basic is this fragment with `Basic <base64 of user:password>` as the value. A credential that
# expires is the OAuth2 recipe (ADR-0024). The extension is defined in `collector-config.yaml`, so
# this file only attaches it, to both transports; on gRPC the header becomes call metadata.
# Selected without a value, it sends the name of the missing variable.

exporters:
  otlphttp/forward:
    auth:
      authenticator: headers_setter/forward
  otlp/forward:
    auth:
      authenticator: headers_setter/forward
