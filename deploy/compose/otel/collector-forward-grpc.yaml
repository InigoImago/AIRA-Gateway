# The delivery channel over OTLP/gRPC instead of OTLP/HTTP.
#
#     AIRA_OTEL_FORWARD_PROTOCOL_CONFIG=/etc/otelcol-contrib/forward-grpc.yaml
#     AIRA_OTEL_FORWARD_GRPC_ENDPOINT=siem.internal:4317
#
# It only moves the three delivery pipelines onto `otlp/forward`; filter, batching and credential
# stay. `_ENCODING` does not reach this leg (gRPC is protobuf), and `make otlp-inspector` cannot read
# it (it is an HTTP receiver). No base pipeline is named, so Grafana is untouched.

service:
  pipelines:
    traces/siem:
      exporters: [otlp/forward]
    metrics/siem:
      exporters: [otlp/forward]
    logs/siem:
      exporters: [otlp/forward]
