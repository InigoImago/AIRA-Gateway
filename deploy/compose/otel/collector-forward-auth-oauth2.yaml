# OAuth2 **client credentials** on the forwarding leg — the vendor-neutral answer to a credential
# that expires.
#
#     AIRA_OTEL_FORWARD_AUTH_CONFIG=/etc/otelcol-contrib/forward-auth-oauth2.yaml
#     AIRA_OTEL_FORWARD_OAUTH_TOKEN_URL=https://idp.internal/oauth2/token
#     AIRA_OTEL_FORWARD_OAUTH_CLIENT_ID=aira-gateway
#     AIRA_OTEL_FORWARD_OAUTH_CLIENT_SECRET=…            # → Vault in a real deployment
#     AIRA_OTEL_FORWARD_OAUTH_SCOPES=["telemetry.write"] # optional; a bare word also works
#
# The collector fetches a token from `token_url`, caches it, and refreshes it before it expires.
# What lives in `.env` is a **client secret** — long-lived — rather than a token, which is not.
#
# ## This is the fragment to reach for, and the reason is worth a paragraph
#
# RFC 6749 §4.4 is what Keycloak, Okta, Auth0, Ping, Entra and every product that sits behind one
# implement. So this single fragment authenticates against essentially any identity provider an
# installation already runs, without this repository knowing which — which is the whole point:
# **AIRA emits, somebody else's identity provider decides.** A fragment per vendor is how a project
# acquires four of them, and each one is a file nobody outside that vendor's customers can use.
#
# Two worked token URLs, as examples rather than as support for a product:
#
#     Keycloak   https://kc.internal/realms/<realm>/protocol/openid-connect/token
#     Entra ID   https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token
#                with AIRA_OTEL_FORWARD_OAUTH_SCOPES=["https://monitor.azure.com/.default"]
#
# The second is how a collector **outside** Azure authenticates to Azure Monitor, and it is the
# reason there is no service-principal fragment in this directory: it would have been this file
# with three values filled in. `forward-auth-azure-identity.yaml` remains for the one case OAuth2
# genuinely cannot express — a platform identity with no secret anywhere.
#
# ## Scopes
#
# `${env:…}` in a value position is resolved and then parsed as YAML, so one variable can carry a
# list: `["a","b"]`. A bare word works too and becomes a single scope. Empty is `[]` — valid, and
# right for a provider that decides scope from the client itself.
#
# ## The audience trap
#
# A token is minted **for an audience**, and for many providers that audience is not the hostname
# you are posting to. If the receiver answers `401` while the token endpoint answers `200`, the
# scope or audience is what to look at first — not the credential, which is the thing everybody
# checks twice.
#
# Both exporters carry it, so this works on either transport without being edited.
#
# ## Selecting this without its values
#
# Measured on 2026-09-07 with the client id empty: `Error: invalid configuration:
# extensions::oauth2client: no ClientID provided in the OAuth2 exporter configuration` — the
# collector **refused to start**, taking Grafana with it, the same undocumented outcome the header
# fragment had. The extension now lives in `collector-config.yaml` with placeholder defaults that
# name the missing variable, so the collector starts and the token endpoint rejects something
# legible. It fetches lazily, so an unselected one never calls its token URL. `FRD-620`.
#
# **And the extension is there rather than here** because `service::extensions` is a list, a merged
# list replaces, and both channels may have a credential selected at once — see
# `collector-forward-auth-header.yaml` for the measurement.

exporters:
  otlphttp/forward:
    auth:
      authenticator: oauth2client/forward
  otlp/forward:
    auth:
      authenticator: oauth2client/forward
