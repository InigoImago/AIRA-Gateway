# The collector, with a second destination — for trying a SIEM (or anything else) alongside.
#
# **A copy of `collector-config.yaml` plus one exporter.** Not an overlay: the Collector merges
# nothing, a `--config` is the whole configuration, so a second destination means a second file.
# Keeping it beside the first makes the difference between them readable in one `diff`, which is
# the only reason this duplication is acceptable.
#
# `LAB_SIEM_ENDPOINT` has no default here **and none in Compose either** — the lab overlay refuses
# to start without it. That is deliberate: an exporter pointing nowhere does not fail, it *retries*
# with growing backoff (measured: 24 s, 36 s, 44 s) while holding telemetry in memory, and the only
# symptom is a line in the collector's log nobody is reading.
#
# What arrives is OTLP/JSON — the protobuf-JSON mapping, nested `resourceSpans[].scopeSpans[]…`,
# not one flat event per line. Whether your SIEM parses that is the question to answer *before*
# wiring this up; `docs/features/FRD-616-the-audit-trail-as-an-event-stream.md` says what the
# content is and, more importantly, what it is not.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: collector
        value: aira-otel-collector
        action: insert
  # **Fewer, larger requests.** Left at `{}` this sends every 200ms — which for a destination
  # that counts requests is the worst shape available. `LAB_SIEM_BATCH_SECONDS` is how long the
  # collector is willing to hold telemetry in order to send it in one piece.
  batch:
    timeout: ${env:LAB_SIEM_BATCH_SECONDS}
    send_batch_size: ${env:LAB_SIEM_BATCH_SIZE}
    send_batch_max_size: ${env:LAB_SIEM_BATCH_SIZE}

exporters:
  otlp_grpc/lgtm:
    endpoint: otel-lgtm:4317
    tls:
      insecure: true
  debug:
    # `LAB_DEBUG_VERBOSITY`: `basic` counts, `normal` one line per span, `detailed` every
    # attribute. This is what *arrived at the collector* — not what was delivered onward, which is
    # a different question and is answered by the metrics below.
    verbosity: ${env:LAB_DEBUG_VERBOSITY}
  # **The exact bytes your endpoint receives**, on the collector's own stdout — `make lab-logs`.
  #
  # Distinct from the `debug` exporter above, which prints what *arrived* in the collector's own
  # format. This is the OTLP/JSON that `otlphttp/lab` posts, written by the same encoding, so what
  # you read is what your SIEM has to parse rather than a second rendering of it.
  #
  # **The path is the switch.** A collector pipeline is a static list — there is no way to add an
  # exporter conditionally — so this one is always in the traces and logs pipelines and writes to
  # `/dev/null` until `LAB_PAYLOAD_PATH=/dev/stdout` says otherwise. It still *encodes* either way,
  # which is why it lives only in this overlay: the reference stack does not pay for it.
  file/payload:
    path: ${env:LAB_PAYLOAD_PATH}
    format: json

  # The second destination. **Fan-out, not replacement**: Grafana keeps working, so a SIEM that is
  # unreachable costs you nothing you already had.
  otlphttp/lab:
    endpoint: ${env:LAB_SIEM_ENDPOINT}
    encoding: json
    tls:
      insecure_skip_verify: ${env:LAB_SIEM_INSECURE}
    # Whatever your SIEM authenticates with. Empty is fine for a first reachability test.
    headers:
      authorization: ${env:LAB_SIEM_AUTHORIZATION}
    # **How hard this pushes.** A receiver that answers `429` is asking for fewer requests, and
    # the exporter's own defaults push in the other direction: `num_consumers: 10` means up to ten
    # concurrent POSTs, and a `429` is *retryable*, so every refusal comes back — a rate limit and
    # a default retry policy make a loop that gets worse under load.
    #
    # One consumer by default here, because this overlay's whole purpose is a destination somebody
    # is trying for the first time, and the polite setting is the one to be wrong about. Raise it
    # when you know the quota:  make up-lab LAB_SIEM_CONSUMERS=4
    sending_queue:
      enabled: true
      num_consumers: ${env:LAB_SIEM_CONSUMERS}
      # Deep enough to ride out a rate limit rather than dropping — telemetry held is telemetry
      # that still arrives, and the memory_limiter above is what stops this becoming unbounded.
      queue_size: ${env:LAB_SIEM_QUEUE}
    retry_on_failure:
      enabled: true
      # Starts further out than the default second: against a quota, retrying quickly is asking
      # the same question before the window has moved.
      initial_interval: ${env:LAB_SIEM_RETRY_INITIAL}
      max_interval: 60s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/lgtm, debug, otlphttp/lab, file/payload]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/lgtm, otlphttp/lab]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/lgtm, debug, otlphttp/lab, file/payload]
  telemetry:
    logs:
      # `LAB_LOG_LEVEL`. At `info` a delivery **failure** is already a line — the retry sender says
      # so with the endpoint and the interval. A **success** says nothing at any level, which is
      # why the metrics below exist: "no errors" and "it arrived" are different statements, and
      # only one of them can be read off a log.
      level: ${env:LAB_LOG_LEVEL}
    metrics:
      # The collector's own figures, on 8889. `otelcol_exporter_sent_spans` against
      # `otelcol_exporter_send_failed_spans`, **per exporter**, is the only thing in this stack
      # that answers *did it arrive* rather than *did anything complain*. `make lab-status` reads
      # them; the port is published so you can too.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889
