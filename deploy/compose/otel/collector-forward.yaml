# The delivery channel: one record per API access and per model access, to a second destination —
# a SIEM, a datalake, another collector (FRD-616, FRD-618). Merged on top of `collector-config.yaml`.
#
#     AIRA_OTEL_FORWARD_CONFIG=/etc/otelcol-contrib/forward.yaml
#     AIRA_OTEL_FORWARD_ENDPOINT=https://siem.internal:4318
#
# Both are needed: the first merges this file, the second says where. The channel adds pipelines of
# its own and names none of the base ones, so Grafana is the same whether this is merged or not.
# Transport and credential are further fragments (`_PROTOCOL_CONFIG`, `_AUTH_CONFIG`); a
# destination beyond the core is a recipe (ADR-0024).
#
# No `headers:` block here: with the variable unset it sends the header empty instead of omitting
# it. A credential is the auth fragment's job.

exporters:
  # OTLP/HTTP, the default. The collector appends `/v1/<signal>` to the endpoint. Compose falls back
  # to a name that never resolves (RFC 2606), so a forgotten endpoint fails this exporter by name in
  # `make otel-status` instead of stopping the collector.
  otlphttp/forward:
    endpoint: ${env:AIRA_OTEL_FORWARD_ENDPOINT:-http://forward-endpoint-not-set.invalid:4318}
    # `json` or `proto`. The OTLP specification requires protobuf and makes JSON optional, so a
    # receiver may refuse JSON. An invalid value stops the collector at validation.
    encoding: ${env:AIRA_OTEL_FORWARD_ENCODING:-json}
    tls:
      # For a first reachability test, not for a deployment.
      insecure_skip_verify: ${env:AIRA_OTEL_FORWARD_INSECURE}
      # A private CA (`deploy/compose/otel/ca/`) is the answer to a receiver behind one; the client
      # certificate is for a receiver that authenticates the sender by mutual TLS.
      ca_file: ${env:AIRA_OTEL_FORWARD_CA_FILE}
      cert_file: ${env:AIRA_OTEL_FORWARD_CLIENT_CERT_FILE}
      key_file: ${env:AIRA_OTEL_FORWARD_CLIENT_KEY_FILE}
    # `none` for a receiver that does not unwrap gzip; its symptom is a 400 about a malformed body.
    compression: ${env:AIRA_OTEL_FORWARD_COMPRESSION:-gzip}
    # Polite defaults (one sender, a 5 s first retry): a 429 is retryable, and many senders against
    # a quota tighten the loop. The queue is in memory, so a restart while the receiver is down
    # loses what it holds (FRD-616 §6).
    sending_queue:
      enabled: true
      num_consumers: ${env:AIRA_OTEL_FORWARD_CONSUMERS}
      queue_size: ${env:AIRA_OTEL_FORWARD_QUEUE}
    retry_on_failure:
      enabled: true
      initial_interval: ${env:AIRA_OTEL_FORWARD_RETRY_INITIAL}
      max_interval: 60s
      max_elapsed_time: 300s

  # OTLP/gRPC, selected by `forward-grpc.yaml` and defined here because an exporter is validated
  # even when unused. `host:port`, no scheme, no encoding; `insecure` is no TLS at all, not
  # `insecure_skip_verify`.
  otlp/forward:
    endpoint: ${env:AIRA_OTEL_FORWARD_GRPC_ENDPOINT:-forward-endpoint-not-set.invalid:4317}
    tls:
      insecure: ${env:AIRA_OTEL_FORWARD_GRPC_PLAINTEXT:-false}
      insecure_skip_verify: ${env:AIRA_OTEL_FORWARD_INSECURE}
      ca_file: ${env:AIRA_OTEL_FORWARD_CA_FILE}
      cert_file: ${env:AIRA_OTEL_FORWARD_CLIENT_CERT_FILE}
      key_file: ${env:AIRA_OTEL_FORWARD_CLIENT_KEY_FILE}
    compression: ${env:AIRA_OTEL_FORWARD_COMPRESSION:-gzip}
    sending_queue:
      enabled: true
      num_consumers: ${env:AIRA_OTEL_FORWARD_CONSUMERS}
      queue_size: ${env:AIRA_OTEL_FORWARD_QUEUE}
    retry_on_failure:
      enabled: true
      initial_interval: ${env:AIRA_OTEL_FORWARD_RETRY_INITIAL}
      max_interval: 60s
      max_elapsed_time: 300s

processors:
  # A SIEM wants one record per request and the calls made inside one, not the SQL and pool spans
  # Grafana wants. `filter` drops what the expression makes true, so it reads as a negation: drop a
  # span unless it carries `aira.use_case` (a request) or is an HTTP call with a parent (a model
  # call inside a request). A parent of sixteen zeroes is the reachability prober (FRD-117). Both
  # spellings of the URL attribute are named, so the semantic-conventions rename cannot empty the
  # feed silently.
  filter/siem:
    error_mode: ignore
    traces:
      span:
        - 'attributes["aira.use_case"] == nil and ((attributes["http.url"] == nil and attributes["url.full"] == nil) or parent_span_id.string == "0000000000000000")'

  # The delivery channel's own batching: redefining the shared `batch` would retime Grafana too.
  batch/siem:
    timeout: ${env:AIRA_OTEL_FORWARD_BATCH_SECONDS}
    send_batch_size: ${env:AIRA_OTEL_FORWARD_BATCH_SIZE}
    send_batch_max_size: ${env:AIRA_OTEL_FORWARD_BATCH_SIZE}

service:
  pipelines:
    # Three pipelines of its own. `memory_limiter` and `resource` are shared on purpose: one guards
    # the process, the other stamps the collector's name on everything it received.
    traces/siem:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/siem, batch/siem]
      exporters: [otlphttp/forward]
    # Metrics and logs go over whole.
    metrics/siem:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch/siem]
      exporters: [otlphttp/forward]
    logs/siem:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch/siem]
      exporters: [otlphttp/forward]
