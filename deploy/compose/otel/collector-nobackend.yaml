# Switch the observability channel off and keep the delivery channel.
#
#     AIRA_OTEL_BACKEND_CONFIG=/etc/otelcol-contrib/nobackend.yaml
#
# Not AIRA_OTEL_ENABLED=false, which stops the applications exporting and so both channels.
# `debug` and `file/arrived` stay: a pipeline needs an exporter, and they cost nothing unread.
# Merged after the channel's transport fragment, so off outranks it.

service:
  pipelines:
    traces:
      exporters: [debug, file/arrived]
    metrics:
      exporters: [debug, file/arrived]
    logs:
      exporters: [debug, file/arrived]
