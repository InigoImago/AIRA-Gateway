# HTTP basic authentication on the **observability channel**.
#
#     AIRA_OTEL_BACKEND_AUTH_CONFIG=/etc/otelcol-contrib/backend-auth-basic.yaml
#     AIRA_OTEL_BACKEND_BASIC_USERNAME=123456
#     AIRA_OTEL_BACKEND_BASIC_PASSWORD=…
#
# The commonest way a hosted trace backend authenticates OTLP: **Grafana Cloud** is a numeric
# instance id and an access policy token over basic auth, and so are a good many on-premises
# collectors behind nginx. Before `FRD-620` this channel could not send a credential at all, so
# that destination — the hosted version of the very product this stack bundles — was out of reach
# without editing a shipped file.
#
# **Only ever over TLS.** Basic auth is the credential in clear text on every request. Against a
# plaintext endpoint — `AIRA_OTEL_BACKEND_PLAINTEXT=true`, or an `http://` URL — it is a password
# broadcast to the network. The collector will not stop you; this sentence is the only guard.
#
# The extension is in `collector-config.yaml` with placeholder defaults, for the reason
# `collector-backend-auth-header.yaml` records: a merged `service::extensions` replaces, and both
# channels may have a credential at once.
#
# Both exporters carry it, so this works over either transport without being edited.

exporters:
  otlp/backend:
    auth:
      authenticator: basicauth/backend
  otlphttp/backend:
    auth:
      authenticator: basicauth/backend
