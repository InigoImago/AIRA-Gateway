# A credential in a header on the observability channel, under whichever name the backend wants:
# `authorization`, `x-api-key`, `DD-API-KEY`, `X-Honeycomb-Team`, …
#
#     AIRA_OTEL_BACKEND_AUTH_CONFIG=/etc/otelcol-contrib/backend-auth-header.yaml
#     AIRA_OTEL_BACKEND_AUTH_HEADER=x-api-key           # default: authorization
#     AIRA_OTEL_BACKEND_AUTHORIZATION=…                 # sent verbatim, scheme and all
#
# HTTP basic is this fragment with `Basic <base64 of user:password>` as the value. A credential that
# expires is a recipe (ADR-0024). The extension is defined in `collector-config.yaml`, so this file
# only attaches it, to both transports. Selected without a value, it sends the name of the missing
# variable.

exporters:
  otlp/backend:
    auth:
      authenticator: headers_setter/backend
  otlphttp/backend:
    auth:
      authenticator: headers_setter/backend
