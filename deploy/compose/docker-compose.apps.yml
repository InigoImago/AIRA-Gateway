# AIRA applications — overlay on top of docker-compose.yml (infrastructure).
#
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
#   # or, from the repo root:  make up-full
#
# The infrastructure file stays usable on its own for the "run the services from source"
# workflow; this file adds the five application processes on top of it.
#
# Startup order is expressed with conditions rather than sleeps: migrations run to completion
# before the services that need the schema, and the topic creation runs before the consumer.

services:
  # ---- one-shot setup ----------------------------------------------------------------------

  # Provision the dev Vault, every start (`FRD-116`).
  #
  # The stack's Vault runs `server -dev`, which keeps everything **in memory**: recreate the
  # container and `secret/aira` is gone. `load_secrets()` then fails closed — correctly, since a
  # secret store that answers "no such path" is not an outage to shrug off — and every application
  # container refuses to boot with a message about a Vault path.
  #
  # That made `make showcase` depend on somebody having run `make vault-init` *after* the current
  # Vault container started, which is a trap laid by our own documentation: run the documented
  # command, then `docker compose down`, and the one command that must always work stops working.
  # Ordering belongs in the file that owns the ordering, so it is a service with a condition on it
  # rather than a step in a Makefile target that three other entry points do not run.
  #
  # **Demo profile only.** A real Vault is provisioned by whoever owns it, with a policy and an
  # AppRole; this repairs a development server that forgets by design. It writes only the
  # `AIRA_*` values this compose file already has, and writing none of them is fine — the path is
  # what the readers need to exist.
  vault-init:
    image: hashicorp/vault:1.18
    container_name: aira-vault-init
    profiles: ["demo"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$VAULT_ADDR" ]; then
          echo "no VAULT_ADDR — secrets come from the environment, nothing to provision"
          exit 0
        fi
        # **Only variables that are actually set.** Vault ranks *above* the environment
        # (`FRD-116`), so writing a key with an empty value does not mean "nothing here" — it
        # means "the value is the empty string", and it silently wins over the real one. The
        # first version of this service wrote all three unconditionally and took the stack down
        # with `no password supplied`, which is the same mistake as `unpriced is not free`, one
        # layer down: absent and empty are different answers.
        set --
        for name in AIRA_GOOGLE_API_KEY AIRA_POSTGRES_PASSWORD AIRA_SECRET_KEY \
                    AIRA_VERTEX_SERVICE_ACCOUNT_JSON AIRA_AZURE_API_KEY AIRA_OPENAI_API_KEY; do
          value=$$(eval echo \$$$$name)
          [ -n "$$value" ] && set -- "$$@" "$$name=$$value"
        done
        # `vault kv put` with no pairs is an error, not an empty write — so a stack with no
        # secrets configured still needs *something* on the path, because what the readers require
        # is the path's existence. The note says why it is otherwise empty, in the one place
        # somebody looking at an empty Vault would go.
        if [ "$$#" -eq 0 ]; then
          set -- "note=provisioned by compose; no AIRA_* secret is set in this stack's .env"
        fi
        # kv-v2 is already mounted at secret/ by the dev server, so only the path is written.
        vault kv put "$${VAULT_MOUNT:-secret}/$${VAULT_PATH:-aira}" "$$@" >/dev/null
        echo "provisioned $${VAULT_MOUNT:-secret}/$${VAULT_PATH:-aira}"
    environment:
      # The CLI talks to the server; the app containers use the same address from their own env.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_DEV_ROOT_TOKEN_ID:-root}}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_PATH: ${VAULT_PATH:-aira}
      AIRA_GOOGLE_API_KEY: ${AIRA_GOOGLE_API_KEY:-}
      AIRA_POSTGRES_PASSWORD: ${AIRA_POSTGRES_PASSWORD:-}
      AIRA_SECRET_KEY: ${AIRA_SECRET_KEY:-}
      AIRA_VERTEX_SERVICE_ACCOUNT_JSON: ${AIRA_VERTEX_SERVICE_ACCOUNT_JSON:-}
      AIRA_AZURE_API_KEY: ${AIRA_AZURE_API_KEY:-}
      AIRA_OPENAI_API_KEY: ${AIRA_OPENAI_API_KEY:-}
    depends_on:
      vault:
        condition: service_healthy
    networks: [aira]
    restart: "no"


  gateway-migrate:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    # **Every service that names this image declares how to build it**, including the ones that
    # only run a second process out of it. A service with `image:` and no `build:` is one compose
    # *pulls* — and `aira-gateway` exists on no registry, so on a machine without the tag already
    # in its local store, `make showcase` tried to fetch four images that cannot be fetched. It
    # worked everywhere the image happened to be lying around, which is every machine that had
    # run it before, and failed on exactly the first run this target exists for.
    build: &gateway-build
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: aira-gateway-migrate
    working_dir: /app/gateway
    command: ["alembic", "upgrade", "head"]
    environment: &gateway-env
      AIRA_ENVIRONMENT: ${AIRA_ENVIRONMENT:-local}
      # ── Secrets from Vault (FRD-116) ──────────────────────────────────────────────────────
      #
      # These were **missing until 2026-08-09**, and their absence was silent by construction:
      # `VaultConfig.configured` is false without an address, `load_secrets()` returns an empty
      # mapping, and every credential quietly comes from the environment instead. The mechanism
      # had been built and tested against a real AppRole for three days while the running stack
      # used none of it — the fourth "two correct halves and no wire" in this repository.
      #
      # An address and a role id **identify**; they are not secrets and belong here. The secret-id
      # is the one value that authorises, and it is read from a file so it never appears in
      # `docker inspect`, in a process list, or in this file.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_PATH: ${VAULT_PATH:-aira}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      # A **file**, not a variable. A secret-id in the environment shows up in `docker inspect`,
      # in `/proc/<pid>/environ`, and in any library that dumps its configuration when it panics.
      VAULT_SECRET_ID_FILE: ${VAULT_SECRET_ID_FILE:-}
      # Passed through because the loader reads them, not because they are recommended.
      # `VAULT_SECRET_ID` is the file's alternative and the worse one — a secret-id in the
      # environment is in `docker inspect` and in `/proc/<pid>/environ` — but omitting a variable
      # the code consults is how this whole feature came to be inert, so it is here and empty.
      # `VAULT_NAMESPACE` is Vault Enterprise; `VAULT_TIMEOUT` is seconds.
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_TIMEOUT: ${VAULT_TIMEOUT:-}
      # Local only. The dev server's root token stands in for an AppRole so `make up` works with
      # no ceremony; `aira_common.secrets` logs a warning every time it is used, because a root
      # token in a deployment is the thing this whole feature exists to avoid.
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      AIRA_POSTGRES_HOST: postgres
      AIRA_POSTGRES_PORT: "5432"
      AIRA_POSTGRES_DB: aira_gateway
      AIRA_POSTGRES_USER: ${POSTGRES_USER:-aira}
      AIRA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aira-local}
      AIRA_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # How this service authenticates to the broker. PLAINTEXT is the local default and is
      # **refused outside `local`**: the config topics are applied straight into the gateway's
      # read-model, so an unauthenticated broker grants access without a credential.
      AIRA_KAFKA_SECURITY_PROTOCOL: ${AIRA_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      AIRA_KAFKA_SASL_MECHANISM: ${AIRA_KAFKA_SASL_MECHANISM:-}
      AIRA_KAFKA_SASL_USERNAME: ${AIRA_KAFKA_SASL_USERNAME:-}
      AIRA_KAFKA_SASL_PASSWORD: ${AIRA_KAFKA_SASL_PASSWORD:-}
      AIRA_KAFKA_SSL_CAFILE: ${AIRA_KAFKA_SSL_CAFILE:-}
      # Shared counters for rate limits and budget reservations (ADR-0008). Empty disables
      # them: limits then hold per process and budgets use the racy read-then-book path.
      AIRA_REDIS_URL: ${AIRA_REDIS_URL:-redis://redis:6379/0}
      AIRA_OIDC_ENABLED: "true"
      # The issuer is what the *browser* obtained the token from, so it must match the token's
      # `iss` claim exactly. The JWKS URI is fetched by this container, which cannot reach
      # "localhost:8080" — hence the in-network override. This split is exactly what
      # AIRA_OIDC_JWKS_URI exists for.
      AIRA_OIDC_ISSUER: ${AIRA_OIDC_ISSUER:-http://localhost:8080/realms/aira}
      AIRA_OIDC_JWKS_URI: ${AIRA_OIDC_JWKS_URI:-http://keycloak:8080/realms/aira/protocol/openid-connect/certs}
      AIRA_OIDC_AUDIENCE: ${AIRA_OIDC_AUDIENCE:-}
      # Which Keycloak group confers which AIRA role (`ADR-0017`). Group membership is the **only**
      # source of a role — a realm role on the same token is not read — so an installation that
      # leaves this empty has nobody holding one.
      AIRA_ROLE_GROUPS: ${AIRA_ROLE_GROUPS:-global-admin=/aira/global-admins;it-security=/aira/it-security;it-steuerung=/aira/it-steuerung}
      AIRA_GOOGLE_API_KEY: ${AIRA_GOOGLE_API_KEY:-}
      # Servers speaking the OpenAI dialect (FRD-123). Empty registers none. The in-network name
      # is `ollama`, not `localhost` — the same split as the JWKS URI above, and the same reason.
      AIRA_OPENAI_SERVERS: ${AIRA_OPENAI_SERVERS:-}
      AIRA_OLLAMA_URL: ${AIRA_OLLAMA_URL:-}
      AIRA_OLLAMA_MODELS: ${AIRA_OLLAMA_MODELS:-}
      AIRA_OLLAMA_EMBEDDING_MODELS: ${AIRA_OLLAMA_EMBEDDING_MODELS:-}
      AIRA_OLLAMA_REGION: ${AIRA_OLLAMA_REGION:-}
      # Missing until 2026-08-08: the setting existed in `config.py` and the compose file never
      # passed it, so raising it changed nothing and the default was the only value any
      # containerised deployment could have. A knob that is not wired is worse than an absent one
      # — somebody turns it and believes the result.
      AIRA_OLLAMA_TIMEOUT_SECONDS: ${AIRA_OLLAMA_TIMEOUT_SECONDS:-}
      # The same gap, twice more. Neither adapter is configured in this stack, which is exactly why
      # nobody noticed: an unpassed setting is invisible until somebody depends on it.
      AIRA_VERTEX_TIMEOUT_SECONDS: ${AIRA_VERTEX_TIMEOUT_SECONDS:-}
      AIRA_FOUNDRY_TIMEOUT_SECONDS: ${AIRA_FOUNDRY_TIMEOUT_SECONDS:-}
      AIRA_ALLOWED_REGIONS: ${AIRA_ALLOWED_REGIONS:-}
      AIRA_OTEL_ENABLED: ${AIRA_OTEL_ENABLED:-false}
      AIRA_OTEL_ENDPOINT: http://otel-collector:4318
      AIRA_LOG_JSON: "true"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [aira]
    restart: "no"

  management-migrate:
    image: aira-management:${AIRA_IMAGE_TAG:-dev}
    build: &management-build
      context: ../..
      dockerfile: management/backend/Dockerfile
    container_name: aira-management-migrate
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &management-env
      # Same as the gateway's: Management holds the Django SECRET_KEY and the database password,
      # which are exactly the values `FRD-116` exists to move out of the environment.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_PATH: ${VAULT_PATH:-aira}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      # A **file**, not a variable. A secret-id in the environment shows up in `docker inspect`,
      # in `/proc/<pid>/environ`, and in any library that dumps its configuration when it panics.
      VAULT_SECRET_ID_FILE: ${VAULT_SECRET_ID_FILE:-}
      # Passed through because the loader reads them, not because they are recommended.
      # `VAULT_SECRET_ID` is the file's alternative and the worse one — a secret-id in the
      # environment is in `docker inspect` and in `/proc/<pid>/environ` — but omitting a variable
      # the code consults is how this whole feature came to be inert, so it is here and empty.
      # `VAULT_NAMESPACE` is Vault Enterprise; `VAULT_TIMEOUT` is seconds.
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_TIMEOUT: ${VAULT_TIMEOUT:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      AIRA_ENVIRONMENT: ${AIRA_ENVIRONMENT:-local}
      AIRA_SECRET_KEY: ${AIRA_SECRET_KEY:-dev-insecure-secret-key-change-me}
      AIRA_DEBUG: ${AIRA_DEBUG:-true}
      AIRA_ALLOWED_HOSTS: ${AIRA_ALLOWED_HOSTS:-*}
      AIRA_POSTGRES_HOST: postgres
      AIRA_POSTGRES_PORT: "5432"
      AIRA_POSTGRES_DB: aira_mgmt
      AIRA_POSTGRES_USER: ${POSTGRES_USER:-aira}
      AIRA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aira-local}
      AIRA_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # How this service authenticates to the broker. PLAINTEXT is the local default and is
      # **refused outside `local`**: the config topics are applied straight into the gateway's
      # read-model, so an unauthenticated broker grants access without a credential.
      AIRA_KAFKA_SECURITY_PROTOCOL: ${AIRA_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      AIRA_KAFKA_SASL_MECHANISM: ${AIRA_KAFKA_SASL_MECHANISM:-}
      AIRA_KAFKA_SASL_USERNAME: ${AIRA_KAFKA_SASL_USERNAME:-}
      AIRA_KAFKA_SASL_PASSWORD: ${AIRA_KAFKA_SASL_PASSWORD:-}
      AIRA_KAFKA_SSL_CAFILE: ${AIRA_KAFKA_SSL_CAFILE:-}
      AIRA_OIDC_ISSUER: ${AIRA_OIDC_ISSUER:-http://localhost:8080/realms/aira}
      AIRA_OIDC_JWKS_URI: ${AIRA_OIDC_JWKS_URI:-http://keycloak:8080/realms/aira/protocol/openid-connect/certs}
      AIRA_OIDC_AUDIENCE: ${AIRA_OIDC_AUDIENCE:-}
      # Which Keycloak group confers which AIRA role (`ADR-0017`). Group membership is the **only**
      # source of a role — a realm role on the same token is not read — so an installation that
      # leaves this empty has nobody holding one.
      AIRA_ROLE_GROUPS: ${AIRA_ROLE_GROUPS:-global-admin=/aira/global-admins;it-security=/aira/it-security;it-steuerung=/aira/it-steuerung}
      AIRA_OTEL_ENABLED: ${AIRA_OTEL_ENABLED:-false}
      AIRA_OTEL_ENDPOINT: http://otel-collector:4318
      AIRA_LOG_JSON: "true"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [aira]
    restart: "no"

  # Demo data (the five role accounts) — only in the `demo` profile. `seed_demo` creates
  # well-known accounts with a fixed password and refuses to run outside local/demo mode
  # (ADR-0007), so a real deployment simply omits this profile.
  management-seed:
    image: aira-management:${AIRA_IMAGE_TAG:-dev}
    build: *management-build
    container_name: aira-management-seed
    profiles: ["demo"]
    command: ["python", "manage.py", "seed_demo"]
    environment:
      <<: *management-env
      AIRA_DEMO_MODE: "true"
      # The showcase declares the local models, so this container has to know whether there is a
      # local endpoint at all — it is the gateway's setting, read here only as a *signal*.
      AIRA_OLLAMA_URL: ${AIRA_OLLAMA_URL:-}
      AIRA_OPENAI_SERVERS: ${AIRA_OPENAI_SERVERS:-}
      AIRA_SEED_LOCAL_CHAT_MODEL: ${AIRA_DEMO_CHAT_MODEL:-qwen3:0.6b}
      AIRA_SEED_LOCAL_EMBED_MODEL: ${AIRA_DEMO_EMBED_MODEL:-all-minilm}
    depends_on:
      management-migrate:
        condition: service_completed_successfully
      # The showcase declares the local models, and declaring one that has not been pulled would
      # put a model in the catalog that every request against it fails on (`FRD-130`).
      ollama-pull:
        condition: service_completed_successfully
    networks: [aira]
    restart: "no"

  # Auto-creation is off on the broker, and the config topics must be compacted — the gateway
  # rebuilds its read-model by replaying them.
  kafka-topics:
    image: apache/kafka:3.9.0
    container_name: aira-kafka-topics
    entrypoint: ["/bin/sh", "-c"]
    # One physical line per command: a folded scalar would turn the continuations into arguments
    # of their own, which the topic tool then rejects.
    command:
      - |
        set -e
        for t in aira.usecases aira.memberships aira.api-keys aira.pipelines aira.budgets aira.rate-limits aira.models aira.anomaly-rules; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic "$$t" --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        done
    depends_on:
      kafka:
        condition: service_healthy
    networks: [aira]
    restart: "no"

  # ---- long-running services ---------------------------------------------------------------

  gateway:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    build: *gateway-build
    container_name: aira-gateway
    environment: *gateway-env
    ports:
      - "${AIRA_GATEWAY_PORT:-8001}:8001"
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      # Not strictly required -- the gateway degrades rather than failing without it (ADR-0008)
      # -- but starting in the degraded state on every boot would make the fallback the normal
      # case and hide a real outage when one happens.
      redis:
        condition: service_healthy
    networks: [aira]
    restart: unless-stopped

  # Same image, second process: applies the config events into the gateway's read-model.
  gateway-consumer:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    build: *gateway-build
    container_name: aira-gateway-consumer
    command: ["python", "-m", "aira_gateway.consumer.worker"]
    # A worker, not a server — the image's HTTP healthcheck would never pass.
    healthcheck:
      disable: true
    environment: *gateway-env
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    networks: [aira]
    restart: unless-stopped

  management:
    image: aira-management:${AIRA_IMAGE_TAG:-dev}
    build: *management-build
    container_name: aira-management
    environment: *management-env
    ports:
      - "${AIRA_MANAGEMENT_PORT:-8002}:8002"
    depends_on:
      management-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks: [aira]
    restart: unless-stopped

  # `manage.py relay` publishes the pending outbox rows once and exits — it is not a daemon.
  # This loop is the development-grade scheduler; in a real deployment use a cron job, a systemd
  # timer or a Kubernetes CronJob (docs/DEPLOYMENT.md §6).
  management-relay:
    image: aira-management:${AIRA_IMAGE_TAG:-dev}
    build: *management-build
    container_name: aira-management-relay
    command:
      - /bin/sh
      - -c
      - 'while true; do python manage.py relay || true; sleep ${AIRA_RELAY_INTERVAL:-10}; done'
    healthcheck:
      disable: true
    environment: *management-env
    depends_on:
      management-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    networks: [aira]
    restart: unless-stopped

  # Stored prompts and responses are personal data; nothing removes them unless something runs
  # this. Hourly here — in a real deployment use a cron job, a systemd timer or a Kubernetes
  # CronJob, the same as the relay (docs/DEPLOYMENT.md §6).
  gateway-retention:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    build: *gateway-build
    container_name: aira-gateway-retention
    command:
      - /bin/sh
      - -c
      - 'while true; do python -m aira_gateway.retention || true; sleep ${AIRA_RETENTION_INTERVAL:-3600}; done'
    healthcheck:
      disable: true
    environment: *gateway-env
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
    networks: [aira]
    restart: unless-stopped

  frontend:
    image: aira-frontend:${AIRA_IMAGE_TAG:-dev}
    build:
      context: ../../management/frontend
      dockerfile: Dockerfile
    container_name: aira-frontend
    environment:
      AIRA_MANAGEMENT_UPSTREAM: http://management:8002
      AIRA_GATEWAY_UPSTREAM: http://gateway:8001
      # Docker's embedded DNS. nginx re-resolves the upstreams through it on every request, so a
      # redeploy of the gateway or of management does not leave this proxy talking to a stale
      # address. Override where the platform provides a different resolver.
      AIRA_DNS_RESOLVER: ${AIRA_DNS_RESOLVER:-127.0.0.11}
    # 4200 on the host because the Keycloak realm pins its redirect URIs to
    # http://localhost:4200 — see deploy/compose/keycloak/realms/aira-realm.json.
    ports:
      - "${AIRA_FRONTEND_PORT:-4200}:8080"
    depends_on:
      - management
      - gateway
    networks: [aira]
    restart: unless-stopped
