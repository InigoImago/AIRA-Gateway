# AIRA applications — the product. Overlay on docker-compose.yml (infrastructure).
#
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
#   # or, from the repo root:  make up-apps
#
# Nothing in this file exists for the demo: the development Keycloak realm, the `-dev` Vault and
# the seeded accounts are in `docker-compose.showcase.yml`, layered on by `make up-full`.
#
# Every value is `${AIRA_…:-default}` and the default is the settings class's own, so an empty
# environment gives you the documented behaviour. Set them in `deploy/compose/.env`, or generate
# that file from a `config/*.yaml` (see `config/README.md`). Secrets do not belong in either —
# they come from Vault.
#
# Startup order is expressed with conditions rather than sleeps: migrations run to completion
# before the services that need the schema, and topic creation before the consumer.

services:
  # ---- one-shot setup ----------------------------------------------------------------------

  gateway-migrate:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    # Every service naming this image also declares how to build it. `aira-gateway` is on no
    # registry, and a service with `image:` and no `build:` is one Compose tries to *pull*.
    build: &gateway-build
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: ${AIRA_STACK:-aira}-gateway-migrate
    working_dir: /app/gateway
    command: ["alembic", "upgrade", "head"]
    environment: &gateway-env
      # Outside `AIRA_ENVIRONMENT=local` the services refuse to start unless six hardening
      # conditions hold. `AIRA_DEMO_MODE=true` waives exactly those six and nothing else — the
      # list is `WAIVED_BY_A_DEMO` in `gateway/security.py`. Leave it `false` for a real
      # deployment; it is what lets a showcase run with a published password and no audience.
      AIRA_DEMO_MODE: ${AIRA_DEMO_MODE:-false}
      # ── Everything else a `config/*.yaml` can set ────────────────────────────────────────
      #
      # Each default below is the settings class's own. `make config-verify` reports any of these
      # that your config file sets and no container receives.
      AIRA_ANOMALY_INTERVAL_SECONDS: ${AIRA_ANOMALY_INTERVAL_SECONDS:-60.0}
      AIRA_API_KEY_DEFAULT_DAYS: ${AIRA_API_KEY_DEFAULT_DAYS:-30}
      AIRA_API_KEY_MAX_DAYS: ${AIRA_API_KEY_MAX_DAYS:-180}
      AIRA_APP_NAME: ${AIRA_APP_NAME:-aira-gateway}
      AIRA_BUDGET_ESTIMATE_OUTPUT_TOKENS: ${AIRA_BUDGET_ESTIMATE_OUTPUT_TOKENS:-1024}
      AIRA_CORS_ALLOW_CREDENTIALS: ${AIRA_CORS_ALLOW_CREDENTIALS:-false}
      AIRA_CORS_ORIGINS: ${AIRA_CORS_ORIGINS:-}
      AIRA_CURRENCY: ${AIRA_CURRENCY:-EUR}
      AIRA_DEFAULT_RETENTION_DAYS: ${AIRA_DEFAULT_RETENTION_DAYS:-7}
      AIRA_DETECT_ANOMALIES: ${AIRA_DETECT_ANOMALIES:-true}
      AIRA_ENFORCE_BUDGETS: ${AIRA_ENFORCE_BUDGETS:-true}
      AIRA_ENFORCE_RATE_LIMITS: ${AIRA_ENFORCE_RATE_LIMITS:-true}
      AIRA_ENFORCE_SUSPENSIONS: ${AIRA_ENFORCE_SUSPENSIONS:-true}
      AIRA_LOG_LEVEL: ${AIRA_LOG_LEVEL:-INFO}
      AIRA_LOG_QUEUE_SIZE: ${AIRA_LOG_QUEUE_SIZE:-512}
      AIRA_LOG_RETENTION_DAYS: ${AIRA_LOG_RETENTION_DAYS:-0}
      AIRA_MAX_AUTH_FAILURES_PER_MINUTE: ${AIRA_MAX_AUTH_FAILURES_PER_MINUTE:-60}
      AIRA_MAX_EMBEDDING_BATCH: ${AIRA_MAX_EMBEDDING_BATCH:-256}
      AIRA_MAX_EMBEDDING_CHARS: ${AIRA_MAX_EMBEDDING_CHARS:-1000000}
      AIRA_MAX_REQUEST_BYTES: ${AIRA_MAX_REQUEST_BYTES:-8388608}
      AIRA_MAX_RESPONSE_SCHEMA_BYTES: ${AIRA_MAX_RESPONSE_SCHEMA_BYTES:-32768}
      AIRA_MAX_RESPONSE_SCHEMA_DEPTH: ${AIRA_MAX_RESPONSE_SCHEMA_DEPTH:-8}
      AIRA_MAX_RESPONSE_SCHEMA_PROPERTIES: ${AIRA_MAX_RESPONSE_SCHEMA_PROPERTIES:-256}
      AIRA_OIDC_CLOCK_SKEW_SECONDS: ${AIRA_OIDC_CLOCK_SKEW_SECONDS:-60.0}
      AIRA_OIDC_EXPIRY_LEEWAY_SECONDS: ${AIRA_OIDC_EXPIRY_LEEWAY_SECONDS:-0.0}
      AIRA_OIDC_ISSUERS: ${AIRA_OIDC_ISSUERS:-}
      AIRA_OTEL_SAMPLE_RATIO: ${AIRA_OTEL_SAMPLE_RATIO:-1.0}
      AIRA_REDACT_PATTERNS: ${AIRA_REDACT_PATTERNS:-}
      AIRA_REQUIRE_USE_CASE: ${AIRA_REQUIRE_USE_CASE:-true}
      AIRA_STORE_PAYLOADS: ${AIRA_STORE_PAYLOADS:-true}
      AIRA_TRUSTED_PROXY_HOPS: ${AIRA_TRUSTED_PROXY_HOPS:-1}
      AIRA_TRUST_FORWARDED_FOR: ${AIRA_TRUST_FORWARDED_FOR:-false}
      AIRA_ENVIRONMENT: ${AIRA_ENVIRONMENT:-local}
      # ── Secrets from Vault ────────────────────────────────────────────────────────────────
      #
      # With no `VAULT_ADDR` the loader is inert and every credential comes from the environment
      # instead — silently. Set the address to turn Vault on.
      #
      # An address and a role id **identify** and are not secrets, so they belong here. The
      # secret-id is the one value that authorises: point `VAULT_SECRET_ID_FILE` at a mounted
      # file so it never appears in `docker inspect` or a process list.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_PATH: ${VAULT_PATH:-aira}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      # A **file**, not a variable. A secret-id in the environment shows up in `docker inspect`,
      # in `/proc/<pid>/environ`, and in any library that dumps its configuration when it panics.
      VAULT_SECRET_ID_FILE: ${VAULT_SECRET_ID_FILE:-}
      # `VAULT_SECRET_ID` is the file's alternative and the worse one: a secret-id in the
      # environment is visible in `docker inspect` and `/proc/<pid>/environ`. Prefer the file.
      # `VAULT_NAMESPACE` is Vault Enterprise; `VAULT_TIMEOUT` is seconds.
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_TIMEOUT: ${VAULT_TIMEOUT:-}
      # Local only. The dev server's root token stands in for an AppRole so `make up` works with
      # no ceremony; `aira_common.secrets` logs a warning every time it is used, because a root
      # token in a deployment is the thing this whole feature exists to avoid.
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      AIRA_POSTGRES_HOST: ${AIRA_POSTGRES_HOST:-postgres}
      AIRA_POSTGRES_PORT: ${AIRA_POSTGRES_PORT:-5432}
      AIRA_POSTGRES_DB: ${AIRA_POSTGRES_DB:-aira_gateway}
      AIRA_POSTGRES_USER: ${AIRA_POSTGRES_USER:-${POSTGRES_USER:-aira}}
      AIRA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aira-local}
      AIRA_KAFKA_BOOTSTRAP_SERVERS: ${AIRA_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      # How this service authenticates to the broker. PLAINTEXT is the local default and is
      # **refused outside `local`**: the config topics are applied straight into the gateway's
      # read-model, so an unauthenticated broker grants access without a credential.
      AIRA_KAFKA_SECURITY_PROTOCOL: ${AIRA_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      AIRA_KAFKA_SASL_MECHANISM: ${AIRA_KAFKA_SASL_MECHANISM:-}
      AIRA_KAFKA_SASL_USERNAME: ${AIRA_KAFKA_SASL_USERNAME:-}
      AIRA_KAFKA_SASL_PASSWORD: ${AIRA_KAFKA_SASL_PASSWORD:-}
      AIRA_KAFKA_SSL_CAFILE: ${AIRA_KAFKA_SSL_CAFILE:-}
      # Shared counters for rate limits and budget reservations. Empty disables
      # them: limits then hold per process and budgets use the racy read-then-book path.
      AIRA_REDIS_URL: ${AIRA_REDIS_URL:-redis://redis:6379/0}
      AIRA_OIDC_ENABLED: ${AIRA_OIDC_ENABLED:-true}
      # Two addresses for one server, and they are not interchangeable. The issuer must match
      # the token's `iss` claim exactly, which is whatever the *browser* obtained it from. The
      # JWKS URI is fetched by this container, which cannot reach the browser's "localhost" —
      # leave it empty to use the in-network address, or set it explicitly.
      AIRA_OIDC_ISSUER: ${AIRA_OIDC_ISSUER:-http://localhost:${AIRA_PUBLISH_KEYCLOAK_PORT:-8080}/realms/aira}
      AIRA_OIDC_JWKS_URI: ${AIRA_OIDC_JWKS_URI:-http://keycloak:8080/realms/aira/protocol/openid-connect/certs}
      AIRA_OIDC_AUDIENCE: ${AIRA_OIDC_AUDIENCE:-}
      # `false` serves **every route to anyone who can reach the port**: no credential, no use
      # case, charged to no budget, bounded by no rate limit, outside the model release, and an
      # audit row that names nobody. The gateway refuses to start with it off unless
      # `AIRA_ENVIRONMENT=local`; `AIRA_DEMO_MODE` does not waive this one.
      AIRA_AUTH_REQUIRED: ${AIRA_AUTH_REQUIRED:-true}
      # Which Keycloak group confers which AIRA role. Group membership is the **only**
      # source of a role — a realm role on the same token is not read — so an installation that
      # leaves this empty has nobody holding one.
      AIRA_ROLE_GROUPS: ${AIRA_ROLE_GROUPS:-global-admin=/aira/global-admins;it-security=/aira/it-security;it-steuerung=/aira/it-steuerung}
      AIRA_GOOGLE_API_KEY: ${AIRA_GOOGLE_API_KEY:-}
      # Servers speaking the OpenAI dialect; empty registers none. Use in-network names
      # (`ollama`), not `localhost` — same reason as the JWKS URI above.
      # Google AI Studio. The key registers the adapter; the model list and base URL are
      # optional overrides.
      AIRA_GEMINI_MODELS: ${AIRA_GEMINI_MODELS:-}
      AIRA_GEMINI_BASE_URL: ${AIRA_GEMINI_BASE_URL:-}
      AIRA_OPENAI_SERVERS: ${AIRA_OPENAI_SERVERS:-}
      AIRA_OLLAMA_URL: ${AIRA_OLLAMA_URL:-}
      AIRA_OLLAMA_MODELS: ${AIRA_OLLAMA_MODELS:-}
      AIRA_OLLAMA_EMBEDDING_MODELS: ${AIRA_OLLAMA_EMBEDDING_MODELS:-}
      AIRA_OLLAMA_REGION: ${AIRA_OLLAMA_REGION:-}
      # Seconds. Local models on modest hardware need more than the HTTP default.
      AIRA_OLLAMA_TIMEOUT_SECONDS: ${AIRA_OLLAMA_TIMEOUT_SECONDS:-}
      # The same gap, twice more. Neither adapter is configured in this stack, which is exactly why
      # nobody noticed: an unpassed setting is invisible until somebody depends on it.
      AIRA_VERTEX_TIMEOUT_SECONDS: ${AIRA_VERTEX_TIMEOUT_SECONDS:-}
      AIRA_FOUNDRY_TIMEOUT_SECONDS: ${AIRA_FOUNDRY_TIMEOUT_SECONDS:-}
      # Vertex AI, the EU-regional platform the residency story rests on. Two ways to
      # authenticate: an API key, or a service-account JSON via `AIRA_VERTEX_CREDENTIALS_JSON` /
      # `GOOGLE_APPLICATION_CREDENTIALS`. `/readyz` lists the adapters that came up.
      AIRA_VERTEX_PROJECT: ${AIRA_VERTEX_PROJECT:-}
      AIRA_VERTEX_CREDENTIALS: ${AIRA_VERTEX_CREDENTIALS:-}
      AIRA_VERTEX_API_KEY: ${AIRA_VERTEX_API_KEY:-}
      AIRA_VERTEX_MODELS: ${AIRA_VERTEX_MODELS:-}
      AIRA_VERTEX_DEFAULT_MAX_TOKENS: ${AIRA_VERTEX_DEFAULT_MAX_TOKENS:-}
      AIRA_FOUNDRY_ENDPOINT: ${AIRA_FOUNDRY_ENDPOINT:-}
      AIRA_FOUNDRY_API_KEY: ${AIRA_FOUNDRY_API_KEY:-}
      AIRA_FOUNDRY_API_VERSION: ${AIRA_FOUNDRY_API_VERSION:-}
      AIRA_FOUNDRY_DEPLOYMENTS: ${AIRA_FOUNDRY_DEPLOYMENTS:-}
      AIRA_ALLOWED_REGIONS: ${AIRA_ALLOWED_REGIONS:-}
      AIRA_OTEL_ENABLED: ${AIRA_OTEL_ENABLED:-false}
      AIRA_OTEL_ENDPOINT: ${AIRA_OTEL_ENDPOINT:-http://otel-collector:4318}
      AIRA_LOG_JSON: ${AIRA_LOG_JSON:-true}
      # One line per call to a system that is not ours, while one is being integrated
      # (`FRD-617`). Empty is off. Names: otel, kafka, auth, vault, redis, postgres, all.
      AIRA_DEBUG_INTEGRATIONS: ${AIRA_DEBUG_INTEGRATIONS:-}
      # How many items of each OTLP batch to print as OTLP/JSON. 0 is off (`FRD-617` §3.10).
      AIRA_DEBUG_OTEL_PAYLOAD: ${AIRA_DEBUG_OTEL_PAYLOAD:-0}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [aira]
    restart: "no"

  management-migrate:
    image: aira-management:${AIRA_IMAGE_TAG:-dev}
    build: &management-build
      context: ../..
      dockerfile: management/backend/Dockerfile
    container_name: ${AIRA_STACK:-aira}-management-migrate
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &management-env
      # Outside `AIRA_ENVIRONMENT=local` the services refuse to start unless six hardening
      # conditions hold. `AIRA_DEMO_MODE=true` waives exactly those six and nothing else — the
      # list is `WAIVED_BY_A_DEMO` in `gateway/security.py`. Leave it `false` for a real
      # deployment; it is what lets a showcase run with a published password and no audience.
      AIRA_DEMO_MODE: ${AIRA_DEMO_MODE:-false}
      # ── Everything else a `config/*.yaml` can set ────────────────────────────────────────
      #
      # Each default below is the settings class's own. `make config-verify` reports any of these
      # that your config file sets and no container receives.
      AIRA_API_KEY_DEFAULT_DAYS: ${AIRA_API_KEY_DEFAULT_DAYS:-30}
      AIRA_API_KEY_MAX_DAYS: ${AIRA_API_KEY_MAX_DAYS:-180}
      AIRA_APP_NAME: ${AIRA_APP_NAME:-aira-management}
      AIRA_CURRENCY: ${AIRA_CURRENCY:-EUR}
      # **Both halves.** `build_directory()` needs the id *and* the secret and returns `None`
      # without either, so passing only the id made `FRD-209`'s directory search unreachable
      # in any containerised deployment: the console silently fell back to what Management
      # already knows, whatever the operator put in `.env`. Prefer Vault for the secret.
      AIRA_DIRECTORY_CLIENT_ID: ${AIRA_DIRECTORY_CLIENT_ID:-}
      AIRA_DIRECTORY_CLIENT_SECRET: ${AIRA_DIRECTORY_CLIENT_SECRET:-}
      AIRA_LOG_LEVEL: ${AIRA_LOG_LEVEL:-INFO}
      AIRA_OIDC_CLOCK_SKEW_SECONDS: ${AIRA_OIDC_CLOCK_SKEW_SECONDS:-60.0}
      AIRA_OIDC_EXPIRY_LEEWAY_SECONDS: ${AIRA_OIDC_EXPIRY_LEEWAY_SECONDS:-0.0}
      AIRA_OTEL_SAMPLE_RATIO: ${AIRA_OTEL_SAMPLE_RATIO:-1.0}
      AIRA_THROTTLE_AUTH_FAILURES: ${AIRA_THROTTLE_AUTH_FAILURES:-60/minute}
      AIRA_THROTTLE_USER: ${AIRA_THROTTLE_USER:-600/minute}
      # Same as the gateway's: Management holds the Django SECRET_KEY and the database password,
      # which are exactly the values Vault exists to keep out of the environment.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_MOUNT: ${VAULT_MOUNT:-secret}
      VAULT_PATH: ${VAULT_PATH:-aira}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      # A **file**, not a variable. A secret-id in the environment shows up in `docker inspect`,
      # in `/proc/<pid>/environ`, and in any library that dumps its configuration when it panics.
      VAULT_SECRET_ID_FILE: ${VAULT_SECRET_ID_FILE:-}
      # `VAULT_SECRET_ID` is the file's alternative and the worse one: a secret-id in the
      # environment is visible in `docker inspect` and `/proc/<pid>/environ`. Prefer the file.
      # `VAULT_NAMESPACE` is Vault Enterprise; `VAULT_TIMEOUT` is seconds.
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_TIMEOUT: ${VAULT_TIMEOUT:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      AIRA_ENVIRONMENT: ${AIRA_ENVIRONMENT:-local}
      AIRA_SECRET_KEY: ${AIRA_SECRET_KEY:-dev-insecure-secret-key-change-me}
      AIRA_DEBUG: ${AIRA_DEBUG:-true}
      AIRA_ALLOWED_HOSTS: ${AIRA_ALLOWED_HOSTS:-*}
      AIRA_POSTGRES_HOST: ${AIRA_POSTGRES_HOST:-postgres}
      AIRA_POSTGRES_PORT: ${AIRA_POSTGRES_PORT:-5432}
      AIRA_POSTGRES_DB: aira_mgmt
      AIRA_POSTGRES_USER: ${AIRA_POSTGRES_USER:-${POSTGRES_USER:-aira}}
      AIRA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aira-local}
      AIRA_KAFKA_BOOTSTRAP_SERVERS: ${AIRA_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      # How this service authenticates to the broker. PLAINTEXT is the local default and is
      # **refused outside `local`**: the config topics are applied straight into the gateway's
      # read-model, so an unauthenticated broker grants access without a credential.
      AIRA_KAFKA_SECURITY_PROTOCOL: ${AIRA_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      AIRA_KAFKA_SASL_MECHANISM: ${AIRA_KAFKA_SASL_MECHANISM:-}
      AIRA_KAFKA_SASL_USERNAME: ${AIRA_KAFKA_SASL_USERNAME:-}
      AIRA_KAFKA_SASL_PASSWORD: ${AIRA_KAFKA_SASL_PASSWORD:-}
      AIRA_KAFKA_SSL_CAFILE: ${AIRA_KAFKA_SSL_CAFILE:-}
      AIRA_OIDC_ISSUER: ${AIRA_OIDC_ISSUER:-http://localhost:${AIRA_PUBLISH_KEYCLOAK_PORT:-8080}/realms/aira}
      AIRA_OIDC_JWKS_URI: ${AIRA_OIDC_JWKS_URI:-http://keycloak:8080/realms/aira/protocol/openid-connect/certs}
      AIRA_OIDC_AUDIENCE: ${AIRA_OIDC_AUDIENCE:-}
      # Which Keycloak group confers which AIRA role. Group membership is the **only**
      # source of a role — a realm role on the same token is not read — so an installation that
      # leaves this empty has nobody holding one.
      AIRA_ROLE_GROUPS: ${AIRA_ROLE_GROUPS:-global-admin=/aira/global-admins;it-security=/aira/it-security;it-steuerung=/aira/it-steuerung}
      AIRA_OTEL_ENABLED: ${AIRA_OTEL_ENABLED:-false}
      AIRA_OTEL_ENDPOINT: ${AIRA_OTEL_ENDPOINT:-http://otel-collector:4318}
      AIRA_LOG_JSON: ${AIRA_LOG_JSON:-true}
      # One line per call to a system that is not ours, while one is being integrated
      # (`FRD-617`). Empty is off. Names: otel, kafka, auth, vault, redis, postgres, all.
      AIRA_DEBUG_INTEGRATIONS: ${AIRA_DEBUG_INTEGRATIONS:-}
      # How many items of each OTLP batch to print as OTLP/JSON. 0 is off (`FRD-617` §3.10).
      AIRA_DEBUG_OTEL_PAYLOAD: ${AIRA_DEBUG_OTEL_PAYLOAD:-0}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [aira]
    restart: "no"

  # Auto-creation is off on the broker, and the config topics must be compacted — the gateway
  # rebuilds its read-model by replaying them.
  kafka-topics:
    image: apache/kafka:3.9.0
    container_name: ${AIRA_STACK:-aira}-kafka-topics
    entrypoint: ["/bin/sh", "-c"]
    # One physical line per command: a folded scalar would turn the continuations into arguments
    # of their own, which the topic tool then rejects.
    command:
      - |
        set -e
        for t in aira.usecases aira.memberships aira.api-keys aira.pipelines aira.budgets aira.rate-limits aira.models aira.anomaly-rules; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic "$$t" --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        done
    depends_on:
      kafka:
        condition: service_healthy
    networks: [aira]
    restart: "no"

  # ---- long-running services ---------------------------------------------------------------

  gateway:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    build: *gateway-build
    container_name: ${AIRA_STACK:-aira}-gateway
    environment: *gateway-env
    ports:
      # Loopback by default, like the infrastructure stack — see `docker-compose.yml`. This one
      # is the port that serves models, and the demo profile seeds a key whose plaintext is in
      # this repository.
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_GATEWAY_PORT:-${AIRA_GATEWAY_PORT:-8001}}:8001"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_GATEWAY_PORT:-${AIRA_GATEWAY_PORT:-8001}}:8001"
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      # Not strictly required -- the gateway degrades rather than failing without it
      # -- but starting in the degraded state on every boot would make the fallback the normal
      # case and hide a real outage when one happens.
      redis:
        condition: service_healthy
    networks: [aira]
    restart: unless-stopped

  # Same image, second process: applies the config events into the gateway's read-model.
  gateway-consumer:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    build: *gateway-build
    container_name: ${AIRA_STACK:-aira}-gateway-consumer
    command: ["python", "-m", "aira_gateway.consumer.worker"]
    # A worker, not a server — the image's HTTP healthcheck would never pass.
    healthcheck:
      disable: true
    environment: *gateway-env
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    networks: [aira]
    restart: unless-stopped

  management:
    image: aira-management:${AIRA_IMAGE_TAG:-dev}
    build: *management-build
    container_name: ${AIRA_STACK:-aira}-management
    environment: *management-env
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_MANAGEMENT_PORT:-${AIRA_MANAGEMENT_PORT:-8002}}:8002"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_MANAGEMENT_PORT:-${AIRA_MANAGEMENT_PORT:-8002}}:8002"
    depends_on:
      management-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks: [aira]
    restart: unless-stopped

  # `manage.py relay` publishes the pending outbox rows once and exits — it is not a daemon.
  # This loop is the development-grade scheduler; in a real deployment use a cron job, a systemd
  # timer or a Kubernetes CronJob (docs/DEPLOYMENT.md §6).
  management-relay:
    image: aira-management:${AIRA_IMAGE_TAG:-dev}
    build: *management-build
    container_name: ${AIRA_STACK:-aira}-management-relay
    command:
      - /bin/sh
      - -c
      - 'while true; do python manage.py relay || true; sleep ${AIRA_RELAY_INTERVAL:-10}; done'
    healthcheck:
      disable: true
    environment: *management-env
    depends_on:
      management-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    networks: [aira]
    restart: unless-stopped

  # Stored prompts and responses are personal data; nothing removes them unless something runs
  # this. Hourly here — in a real deployment use a cron job, a systemd timer or a Kubernetes
  # CronJob, the same as the relay (docs/DEPLOYMENT.md §6).
  gateway-retention:
    image: aira-gateway:${AIRA_IMAGE_TAG:-dev}
    build: *gateway-build
    container_name: ${AIRA_STACK:-aira}-gateway-retention
    command:
      - /bin/sh
      - -c
      - 'while true; do python -m aira_gateway.retention || true; sleep ${AIRA_RETENTION_INTERVAL:-3600}; done'
    healthcheck:
      disable: true
    environment: *gateway-env
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
    networks: [aira]
    restart: unless-stopped

  frontend:
    image: aira-frontend:${AIRA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: management/frontend/Dockerfile
    container_name: ${AIRA_STACK:-aira}-frontend
    environment:
      AIRA_MANAGEMENT_UPSTREAM: ${AIRA_MANAGEMENT_UPSTREAM:-http://management:8002}
      AIRA_GATEWAY_UPSTREAM: ${AIRA_GATEWAY_UPSTREAM:-http://gateway:8001}
      # One variable, two consumers: the console's entrypoint writes `runtime-config.js` from
      # this *and* derives the content policy's `connect-src` from its origin. Moving Keycloak is
      # therefore one change here, not a JavaScript file inside a built image plus a header.
      AIRA_OIDC_ISSUER: ${AIRA_OIDC_ISSUER:-http://localhost:${AIRA_PUBLISH_KEYCLOAK_PORT:-8080}/realms/aira}
      AIRA_OIDC_CLIENT_ID: ${AIRA_OIDC_CLIENT_ID:-aira-gateway}
      # Only for a deployment that needs something the derivation cannot guess — a second origin,
      # a websocket host. Left empty, the issuer's origin is used.
      AIRA_CSP_CONNECT_SRC: ${AIRA_CSP_CONNECT_SRC:-}
      # Docker's embedded DNS. nginx re-resolves the upstreams through it on every request, so a
      # redeploy of the gateway or of management does not leave this proxy talking to a stale
      # address. Override where the platform provides a different resolver.
      AIRA_DNS_RESOLVER: ${AIRA_DNS_RESOLVER:-127.0.0.11}
    # The realm's redirect URIs follow this port: Keycloak substitutes `${AIRA_CONSOLE_PORT:4200}`
    # on import. Moving the console therefore moves the login redirect with it.
    ports:
      - "${AIRA_BIND_HOST:-127.0.0.1}:${AIRA_PUBLISH_FRONTEND_PORT:-${AIRA_FRONTEND_PORT:-4200}}:8080"
      - "[${AIRA_BIND_HOST6:-::1}]:${AIRA_PUBLISH_FRONTEND_PORT:-${AIRA_FRONTEND_PORT:-4200}}:8080"
    depends_on:
      - management
      - gateway
    networks: [aira]
    restart: unless-stopped
