# Make the AIRA dashboard appear on its own (`FRD-615`).
#
# `otel-lgtm` ships RED-metric dashboards and leaves the drop-in provider commented out in its own
# `sample.yaml`. Without it, a reader who has just turned telemetry on lands on a Grafana with four
# datasources, no view of their own system, and has to know that the way in is Explore -> Tempo ->
# Search. The data was there and nothing pointed at it — which is `FRD-206`'s defect wearing an
# operations hat.
apiVersion: 1

providers:
  - name: AIRA
    orgId: 1
    folder: AIRA
    type: file
    disableDeletion: false
    # **False, and this is the whole reason the dashboard is in the repository.**
    #
    # With UI updates allowed, Grafana keeps its own copy the moment its stored version reaches the
    # file's, and the provisioner then *skips* the file — silently, with `reload` answering `200`.
    # Measured: a fourth panel added to the file never appeared, Grafana served three panels at its
    # own version 4 while the file said version 3, and every check short of counting the panels
    # passed. A dashboard that ships with the code has to be owned by the code; somebody who wants
    # it different changes the file, which is also how the change reaches everybody else.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/aira
      foldersFromFilesStructure: false
