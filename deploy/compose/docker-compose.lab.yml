# Trying something alongside the stack, without touching the stack.
#
# **Opt-in by being an extra `-f`, and that is the whole design.** The reference stack is described
# by three files and `tools/compose_files.py` decides which is which (read its docstring: a split
# is cheap to make and expensive to get wrong, because sixteen places named the files by hand).
# This is a **fourth**, deliberately in none of those lists — `make up-lab` is the only thing that
# adds it, and an experiment that goes wrong is undone by leaving one `-f` out.
#
#     make up-lab LAB_SIEM_ENDPOINT=http://t-siem-otel:4318
#
# It exists because the two questions people actually have — *"can this reach a machine on my
# network"* and *"what would that machine receive"* — are both answered by editing the reference
# stack, and then the reference stack is no longer what the documentation describes.
#
# ## Reaching a host that is not in this network
#
# Containers on a user-defined bridge always resolve through Docker's embedded DNS at 127.0.0.11,
# and `dns:` / `dns_search:` do **not** replace it — they set what it forwards to and what it
# appends. Measured against this stack: with `--dns 9.9.9.9 --dns-search intern.example` the
# container still resolved `postgres` and `otel-collector` by name. So none of the three ways below
# can cost you the internal network; they differ only in what they can find.
#
# 1. `extra_hosts` — a name straight into `/etc/hosts`. No DNS involved, so nothing to break. Best
#    where the address is stable, which a SIEM's usually is.
# 2. `dns_search` — makes a short name like `t-siem-otel` resolve as `t-siem-otel.intern.example`.
#    Needs the resolver the **daemon** uses to know that name; that is where this fails, never the
#    Compose network.
# 3. `dns` — only when the daemon's resolver is not the one that knows your hosts.
#
# And the simplest: use the fully-qualified name and change nothing here.

services:
  otel-collector:
    # The same collector with one destination more. See the file for why a second config rather
    # than an overlay, and for what OTLP/JSON actually is.
    volumes:
      - ./otel/collector-config.lab.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Writable, for `LAB_PAYLOAD_PATH=/payload/otlp.json`. Git-ignored; nothing is written here
      # unless that variable names a path inside it.
      - ./payload:/payload
    environment:
      # **No default, on purpose.** An exporter with nowhere to send retries with growing backoff
      # and holds telemetry in memory; the failure is a log line nobody reads. Compose refuses to
      # start instead, and says what to set.
      LAB_SIEM_ENDPOINT: ${LAB_SIEM_ENDPOINT:?set it to your SIEM OTLP endpoint, e.g. make up-lab LAB_SIEM_ENDPOINT=http://t-siem-otel:4318}
      LAB_SIEM_AUTHORIZATION: ${LAB_SIEM_AUTHORIZATION:-}
      LAB_SIEM_INSECURE: ${LAB_SIEM_INSECURE:-false}
      # How loud the collector is about itself. `debug` shows the export attempts; `info` shows
      # only the failures, which is enough most of the time.
      LAB_LOG_LEVEL: ${LAB_LOG_LEVEL:-info}
      # What the `debug` exporter prints about traffic **arriving**: basic | normal | detailed.
      LAB_DEBUG_VERBOSITY: ${LAB_DEBUG_VERBOSITY:-normal}
      # ---- How hard the collector pushes at your endpoint -------------------------------------
      #
      # For the destination that answers `429`. Measured on this stack: a gateway produces about
      # **17.5 spans per request**, and the applications' own exporter posts every 5 seconds — so
      # the collector receives in bursts, and left at its defaults it forwards them every 200ms
      # from ten concurrent senders. A receiver counting requests sees the worst possible shape.
      #
      # These four turn that into few, large, sequential requests. Raise them back when you know
      # the quota you actually have.
      #
      # How long the collector will hold telemetry to send it in one piece.
      LAB_SIEM_BATCH_SECONDS: ${LAB_SIEM_BATCH_SECONDS:-10s}
      # And how much fits in one. 8192 is the collector's own default; larger means fewer requests
      # and a bigger body, which is the trade a rate limit asks you to make.
      LAB_SIEM_BATCH_SIZE: ${LAB_SIEM_BATCH_SIZE:-8192}
      # Concurrent senders. **One** by default: the exporter's own default is ten, and a `429` is
      # retryable, so ten senders against a quota is a loop that tightens under load.
      LAB_SIEM_CONSUMERS: ${LAB_SIEM_CONSUMERS:-1}
      # How much may wait while the receiver says no. Held rather than dropped; `memory_limiter`
      # is what keeps that bounded.
      LAB_SIEM_QUEUE: ${LAB_SIEM_QUEUE:-5000}
      # How long to wait before asking again. The default is one second, which against a quota is
      # the same question before the window has moved.
      LAB_SIEM_RETRY_INITIAL: ${LAB_SIEM_RETRY_INITIAL:-5s}
      # ---- The payload itself, on the collector's stdout --------------------------------------
      #
      # `/dev/stdout` prints the **exact OTLP/JSON** that goes to your endpoint — same encoding,
      # so what you read is what your SIEM has to parse. `make lab-logs` to watch it.
      #
      #     make up-lab LAB_SIEM_ENDPOINT=… LAB_PAYLOAD_PATH=/dev/stdout
      #
      # `/dev/null` by default because one span batch is up to 8192 spans and each is a page of
      # JSON.
      #
      # **stdout mangles a large one.** Measured: Docker's json-file driver splits at a 16 KiB
      # boundary and `docker logs` hands back a fragment — a 49 692-character payload came out cut
      # at exactly 48 KiB and would not parse, while everything under ~8 KiB was intact. So stdout
      # is for a look, and a **file** is for a payload you mean to keep or hand to somebody:
      #
      #     make up-lab LAB_SIEM_ENDPOINT=… LAB_PAYLOAD_PATH=/payload/otlp.json
      #     # then: deploy/compose/payload/otlp.json, whole, however big
      #
      # Pair either with a small `LAB_SIEM_BATCH_SIZE` while you are reading — one span per line is
      # worth more than eight thousand.
      LAB_PAYLOAD_PATH: ${LAB_PAYLOAD_PATH:-/dev/null}
    ports:
      # The collector's own metrics — `sent` against `send_failed`, per exporter. Published so
      # `make lab-status` can ask from outside the network, and bound to loopback like everything
      # else this stack publishes.
      - "${AIRA_BIND_HOST:-127.0.0.1}:${LAB_METRICS_PORT:-8889}:8889"
    extra_hosts:
      # The host this stack runs on, for a SIEM you have port-forwarded there.
      - "host.docker.internal:host-gateway"
      # One machine on your network, by name. The defaults are deliberately nowhere — `.invalid`
      # never resolves (RFC 2606) and `192.0.2.0/24` is unroutable test space (RFC 5737) — so the
      # entry is inert until you mean it:
      #
      #     make up-lab LAB_SIEM_ENDPOINT=http://t-siem-otel:4318 \
      #                 LAB_HOST_ALIAS=t-siem-otel LAB_HOST_IP=10.20.30.40
      - "${LAB_HOST_ALIAS:-unset.invalid}:${LAB_HOST_IP:-192.0.2.1}"
    # Uncomment where a **short** name has to resolve through your own DNS rather than being
    # pinned above. Neither line can cost you container-name resolution — see the header.
    #
    # dns_search:
    #   - intern.example
    # dns:
    #   - 10.20.30.1
