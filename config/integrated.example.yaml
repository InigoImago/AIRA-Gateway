# AIRA — an integrated installation, described in one file (`docs/deployment/integrated.md`).
#
# **Your** Keycloak, your PostgreSQL, your Kafka, your model platforms. The applications are
# stateless containers pointed at infrastructure somebody else runs and somebody else backs up —
# under Compose, `make up-integrated`. Everything in containers on one machine is the other
# example, `standalone.example.yaml` (`docs/deployment/standalone.md`).
#
#     cp config/integrated.example.yaml config/my-installation.yaml
#     $EDITOR config/my-installation.yaml
#     uv run python tools/config_render.py config/my-installation.yaml -o deploy/compose/.env
#
# Each section name is a prefix and each key completes it: `postgres.host` is `AIRA_POSTGRES_HOST`.
# The `core` section is the exception — its keys are used unprefixed — and `vault` is the other,
# documented where it appears.
#
# What each connected system must provide is `docs/INTEGRATIONS.md`; what each variable does and
# what breaks without it is `docs/CONFIGURATION.md`. This is the file you edit.
#
# **No secrets.** Every credential comes from HashiCorp Vault (`FRD-116`), and the renderer refuses
# a key it recognises as one.

core:
  # `local` relaxes exactly the checks a laptop needs (`ADR-0007`); anything else demands an OIDC
  # audience, a real `secret_key`, `debug` off, and Kafka authentication that is not `PLAINTEXT` —
  # `docs/CONFIGURATION.md` §8 lists every check.
  environment: production
  # Off, and the one setting that must never be turned on here: it makes the published demo API
  # key a working credential, lets `seed_demo` seed demo data, waives six of the gateway's start-up
  # checks, and opens its API documentation and `/readyz` diagnosis to anyone (`ADR-0007`).
  demo_mode: false
  debug: false
  # One log line per call to a system that is not ours, while you are wiring one up (`FRD-617`).
  # Empty is off and is what a working installation runs. Names: otel, kafka, auth, vault, redis,
  # postgres — or `all`. A name this build does not know refuses the process at start-up, rather
  # than starting and watching nothing.
  #
  #     debug_integrations: otel,kafka
  debug_integrations: ""
  # How many items of each OTLP batch to print as OTLP/JSON on stdout. 0 is off, and off is what
  # an installation runs — this renders on the exporter's thread, on every export.
  debug_otel_payload: 0
  # The OpenTelemetry `service.name`. One value for **both** planes: Compose hands it to the gateway
  # and to Management alike, so their traces carry the same name. Without the line each keeps its
  # own (`aira-gateway`, `aira-management`).
  app_name: AIRA Gateway
  # One installation, one currency. It labels every figure in the console, every CSV column and
  # the prices in the model catalog — see `docs/DEVLOG.md` for the round where three screens said
  # something else.
  currency: EUR
  # The installation's clock, an IANA name such as `Europe/Berlin`: where a budget's day and month
  # begin, the days of every report and chart, and the clock every time in the console is shown
  # on. Both services read it. UTC when unset; a change moves the period in progress once.
  time_zone: UTC
  # Which Keycloak group confers which AIRA role (`ADR-0017`). Group membership is the **only**
  # source of a role; a realm role on the same token is not read. Management refuses to start
  # without a group for `global-admin`.
  role_groups: global-admin=/it/aira-admins;it-security=/it/security;it-steuerung=/it/governance
  # A caller must name a use case, from the start (`docs/INTEGRATIONS.md` §9). On by default, and
  # switching it off refuses to start anywhere but `local`: a call without one is charged to no
  # budget and bounded by no use-case limit.
  require_use_case: true
  # Whether prompts and answers are stored at all, and for how long, unless a use case says
  # otherwise (`FRD-404`).
  store_payloads: true
  # Nobody but Global Administrator and IT Security sees a person — content, figures per person,
  # names and keys on requests, the person a finding names. Off, each use case decides again.
  strict_data_mode: true
  # A stream whose caller left is read on until the vendor has finished it, at most this many
  # seconds, so the vendor's own figure is booked (`ADR-0041`); the answer is then billed whole.
  # 0 closes it with the caller, and the count below applies.
  drain_left_streams_seconds: 600
  # The longest a streamed answer leaves its connection silent (`ADR-0046`): the status goes out
  # after this long even before the model's first word, and a quiet stream sends a keepalive this
  # often, so a proxy's idle timeout never closes it. 0 sends nothing, as before.
  stream_keepalive_seconds: 15
  # A stream whose caller left before the vendor said what it used is counted at the vendor's own
  # free endpoint and booked as a floor (`FRD-128` FR-6). Off sends nothing to the vendor a second
  # time — the privacy notice says it does — and such a stream stays unknown.
  count_cancelled_streams: true
  default_retention_days: 7
  auth_required: true
  # Extra patterns redacted from stored payloads (`FRD-406`): regular expressions separated by `;`
  # or a newline, **added to** the built-in credential shapes. Empty uses the built-in ones alone.
  redact_patterns: ''
  # On, because a reverse proxy terminates TLS in front of both APIs here. The header is read
  # `trusted_proxy_hops` entries **from the right**, never the left: the left end is whatever
  # the caller sent, and reading it lets a caller choose the address on every audit row and the
  # key the brute-force bound counts against. One per proxy that appends. Management reads
  # `trusted_proxy_hops` whatever `trust_forwarded_for` says, and takes the leftmost entry of a
  # shorter chain — so count exactly (`docs/CONFIGURATION.md` §2).
  trust_forwarded_for: true
  trusted_proxy_hops: 1

# The three governance controls. Off means *measured and not enforced* — which is the honest way to
# introduce them, and the wrong way to leave them.
enforce:
  budgets: true
  rate_limits: true
  suspensions: true
  # A model with no price cannot be counted against a *cost* budget, so it would spend without
  # bound (`FRD-610` §3.2). Off keeps such traffic flowing while prices are filled in — knowing
  # the limit is not a limit. Token and request limits are unaffected.
  priced_models: true

# Watching traffic for the patterns `FRD-503` describes, and acting on them. `alert` first and
# `block` later is the order `docs/INTEGRATIONS.md` §9 argues for: a rule is a hypothesis until
# somebody has watched it be right, and a detector that blocks wrongly once is switched off for
# ever.
detect:
  anomalies: true

anomaly:
  interval_seconds: 60.0

# What a request is assumed to cost before the answer exists, so a budget can refuse *before* the
# money is spent rather than after. Too low and a budget is overshot by one request; too high and
# the last request of a period is refused for an answer that would have fitted.
budget:
  estimate_output_tokens: 1024

# ---------------------------------------------------------------------------------------------
# PostgreSQL — both planes, two databases on one server.
# ---------------------------------------------------------------------------------------------
postgres:
  host: postgres.internal.example.com
  port: 5432
  db: aira_gateway
  user: aira
  # password: → Vault. See `secrets:`.

# ---------------------------------------------------------------------------------------------
# Keycloak (or any OIDC provider). What the realm must provide is `docs/INTEGRATIONS.md` §2.
# ---------------------------------------------------------------------------------------------
oidc:
  enabled: true
  # The **same URL the browser uses**. The `iss` claim is compared literally, so a browser on
  # `https://sso.example.com` and containers on `http://keycloak:8080` means one of the two
  # rejects every token.
  issuer: https://sso.example.com/realms/aira
  # Required outside `local`, and Keycloak does **not** put it in the token by itself: a public
  # client's `aud` is `["account"]` until an Audience mapper or a client scope says otherwise.
  audience: aira-gateway
  # **The console's own client**, and not a setting of either plane: the console's entrypoint
  # writes it into `runtime-config.js` at container start (as it reads `csp`, `management`,
  # `gateway` and `dns` below). One image, any realm.
  client_id: aira-gateway
  # Where the containers fetch the realm's signing keys. The issuer is what the *browser* got the
  # token from and must match `iss` exactly; the key set is fetched by the services, from an
  # address they can reach. **Required here**: `make up-integrated` refuses to start without it
  # (`docker-compose.external.yml`), because the bundled stack's in-network default would be
  # somebody else's server. `https://`, or a loopback address — plain `http://` refuses to start.
  jwks_uri: https://sso.example.com/realms/aira/protocol/openid-connect/certs
  # Several realms at once (`FRD-118`), `issuer|audience|jwks_uri` per entry, `;`-separated. The
  # gateway's alone: Management and the console read the single `issuer` above.
  issuers: ''
  # How far the issuer's clock may run ahead of this host's. At 0 a service one second behind its
  # issuer refuses **every** freshly minted token, which reads exactly like a wrong secret.
  clock_skew_seconds: 60
  # How long past `exp` a token is still accepted. This is the half with a cost, so it is off.
  expiry_leeway_seconds: 0

# The privacy notice every console user acknowledges (`FRD-625`). `privacy.controller` is printed
# as Art. 13(1)(a) DSGVO requires and **required outside `local`**; `notice_mode` is `once`,
# `monthly` or `always` — the last for whoever is reviewing the notice, not for everyday use.
privacy:
  controller: 'Example GmbH, Example Street 1, 12345 Example, privacy@example.com'
  dpo_contact: 'dpo@example.com'
  works_agreement: ''
  notice_mode: monthly
  default_language: de

# A read-only Keycloak service account, so the console can *search* your groups and people when
# granting access (`view-users`, `query-groups`, nothing else), and so a group is checked before a
# role is bound to it (`FRD-614`). Without it the console offers only what it already knows — and
# no custom role can be bound. `url` is where Management reaches Keycloak's admin API. Name it:
# the settings read an empty value as the issuer's server, but Compose replaces an empty one with
# its development default `http://keycloak:8080`, which an integrated deployment does not have.
directory:
  client_id: aira-directory
  url: https://sso.example.com
  # client_secret: → Vault.

# The model reference the console fills a new catalog entry from: a public list's limits,
# capabilities and list prices, for an administrator to check. Empty answers from the copy this
# release ships; `https://models.dev/api.json` reads today's list — Management's one outbound call
# to it, at most daily.
model:
  reference_url: ''
  # Units of `currency` per US dollar, for the reference's list prices where the billing
  # account has none. Empty: dollar prices are shown, not filled.
  reference_exchange_rate: ''

# ---------------------------------------------------------------------------------------------
# The console, a static bundle behind nginx, configured when its **container starts**
# (`docs/INTEGRATIONS.md` §7). None of these is a setting of either plane: the entrypoint writes
# `runtime-config.js` from `oidc.issuer` and `oidc.client_id`, and templates the proxy from these.
# ---------------------------------------------------------------------------------------------

# What the console's content policy lets it call. Left empty it is derived from the issuer's
# origin, which is the only thing the console calls cross-origin — set it only for something the
# derivation cannot guess, a second origin or a websocket host, and then name the issuer's origin
# too: a value replaces the derivation. Getting it wrong produces a login that fails **in the
# browser and nowhere else**.
csp:
  connect_src: ''

# Where the console's nginx sends `/api` and `/gw`: addresses **its container** can reach. Under
# `make up-integrated` the console runs on the same Compose network as the two services, so these
# are their service names — `127.0.0.1` there would be the console's own container. Elsewhere,
# the services' addresses as the console reaches them.
management:
  upstream: http://management:8002
  # Management's own database user and Kafka identity — the relay's, which writes — in place of
  # `postgres.user` and `kafka.sasl_username`, where the database and the broker give each plane an
  # identity of its own. Their passwords go to Vault beside the shared ones (`secrets:`), so one
  # path serves both planes. Empty: the shared ones.
  #
  #     postgres_user: aira_mgmtusr
  #     kafka_sasl_username: aira-relay
  postgres_user: ''
  kafka_sasl_username: ''
gateway:
  upstream: http://gateway:8001
  # The gateway's own, the same way — the consumer's identity, which only reads.
  #
  #     postgres_user: aira_gatewayusr
  #     kafka_sasl_username: aira-consumer
  postgres_user: ''
  kafka_sasl_username: ''

# nginx re-resolves the upstreams on every request through this, so a redeploy of either service
# does not leave the proxy talking to an address that has moved. Docker's embedded DNS by default.
dns:
  resolver: 127.0.0.11

# ---------------------------------------------------------------------------------------------
# Apache Kafka — the bus the two planes speak over, and a trust boundary.
# ---------------------------------------------------------------------------------------------
kafka:
  bootstrap_servers: kafka-1.internal:9093,kafka-2.internal:9093
  # The stage in every topic name on a cluster several stages share: `aira.t.usecases`.
  stage: t
  # `PLAINTEXT` is refused outside `local`: the gateway builds the read-model its authorization
  # comes from out of these topics.
  security_protocol: SASL_SSL
  sasl_mechanism: SCRAM-SHA-512
  sasl_username: aira
  # sasl_password: → Vault.
  ssl_cafile: /etc/ssl/certs/internal-ca.pem

# ---------------------------------------------------------------------------------------------
# Redis — rate limits that hold across several gateway instances. Without it they are per-process.
# ---------------------------------------------------------------------------------------------
redis:
  # Empty: the sentinels below replace it. A URL beside them would be ignored.
  url: ''
  # Redis Sentinel: the sentinels and the name they know the leader by.
  sentinels: redis-s1.internal:26379,redis-s2.internal:26379,redis-s3.internal:26379
  sentinel_service: aira
  username: ''
  db: 0
  # password: → Vault. sentinel_password: → Vault.

# ---------------------------------------------------------------------------------------------
# Model platforms. Configure the ones you have; an absent one is simply not offered.
# ---------------------------------------------------------------------------------------------

# Self-hosted, OpenAI-compatible (Ollama, vLLM, …), as one server named `ollama` — registered
# when a URL and at least one model are set.
ollama:
  url: ''
  models: ''
  embedding_models: ''
  # Where the machine physically is, for the residency half of the register (`FRD-608`).
  region: ''
  # The answer allowance for every OpenAI-compatible server, `openai.servers` included.
  timeout_seconds: 120

# Several named OpenAI-compatible servers instead of the single endpoint above (`FRD-123`):
# `name=url|models|embedding_models|region`, `;`-separated, the lists `,`-separated.
openai:
  servers: ''

# Google Agent Platform (formerly Vertex AI) — Gemini and Anthropic, EU-regional. Each model is
# `region/publisher/model`, the region one `allowed.regions` permits; anything else stops the
# gateway once Vault supplies the credential.
vertex:
  project: my-gcp-project
  models: europe-west1/google/gemini-2.5-flash,europe-west1/google/gemini-2.5-pro
  default_max_tokens: 4096
  # Claude's tools strict: only where the organisation policy allows structured_outputs.
  partner_strict_tools: false
  timeout_seconds: 120
  # The key as a file the gateway reads (a Compose or Kubernetes secret), re-read when it
  # changes. A path, not a secret; the key itself never goes in this file.
  credentials_file: ''
  # No Google key: workload identity federation through your OIDC provider (the client's secret
  # → Vault), with `credentials`/`credentials_file` holding Google's external_account
  # configuration. Or, on Google Cloud, the machine's own account.
  federation_token_url: ''
  federation_client_id: ''
  metadata_server: false
  # The Google billing account whose prices the console fills (needs Billing Account Viewer).
  billing_account: ''
  # credentials / api_key: → Vault. Claude on Vertex needs the service account (`credentials`).

# Google AI Studio (the public Gemini API). Its region is `global`, which `allowed.regions` would
# have to name before a key could be used. The base URL keeps its `/v1beta`: the adapter appends
# `/models/<model>:<method>`.
gemini:
  base_url: https://generativelanguage.googleapis.com/v1beta
  models: ''

# Microsoft Foundry / Azure OpenAI. `deployments` is `model=deployment|region[|embed]`,
# `;`-separated, every region one `allowed.regions` permits.
foundry:
  endpoint: ''
  api_version: '2024-10-21'
  deployments: ''
  timeout_seconds: 120
  # api_key: → Vault.

# Where a model may be served from at all. A model reachable only at `global` is not usable here
# (`FRD-611`): `global` names no region and guarantees none.
allowed:
  regions: europe-west1,europe-west4
  # A region permitted for named models alone: `region=model,model;region=model`. Agent Platform's
  # open models (GLM, DeepSeek) answer only at `global` (`FRD-115` FR-2a); permitting it for them
  # by name leaves it refused for every other model.
  model_regions: ''
  hosts: aira.example.com

# ---------------------------------------------------------------------------------------------
# Observability — OTLP to a collector, and from there wherever you send it (`ADR-0004`).
# ---------------------------------------------------------------------------------------------
otel:
  # Where **the applications** export to — the collector. Everything below is what the collector
  # does with it, and that is two independent channels (`FRD-618`):
  #
  #   observability  every span, metric and log — `backend_*` here
  #   delivery       one record per API access and per model access — `forward_*` below
  #
  # Neither is a branch of the other, and neither can retune the other.
  enabled: true
  endpoint: http://otel-collector.internal:4318
  # A tenth of the traces — and so a tenth of the delivery channel's access records, which are
  # spans. `1.0` where a SIEM has to see every access; the audit trail is whole either way.
  sample_ratio: 0.1

  # ---- What the collector says about what arrives (`FRD-617`) --------------------------------
  # `basic` counts · `normal` a line per span · `detailed` every attribute, event and link.
  # `make otel-arrivals` reads it; leave it at `normal` unless something is being investigated.
  debug_verbosity: normal
  # The same arrivals as OTLP/JSON, to parse rather than read. `/dev/null` is off. These two are
  # about **this collector** rather than about either destination, so they belong to neither
  # channel and are set outright rather than commented.
  arrived_file: /dev/null

  # ---- Channel 1: observability, to your trace backend ---------------------------------------
  #
  # **Every axis below has the same name on the other channel, one prefix along** (`FRD-620`).
  # That was not true until then: this channel had four knobs and no credential while the delivery
  # channel had seventeen and four authenticators, so a trace backend behind any authentication —
  # or one wanting OTLP/JSON, or reachable only over HTTP — meant editing a shipped file.
  #
  # `host:port`, **no scheme** — OTLP/gRPC, this channel's default transport. Commented out means
  # the bundled Grafana, which is the demo's backend and not yours. Uncomment and it is yours;
  # nothing else about the stack changes.
  #
  #   backend_endpoint: tempo.internal:4317
  #   backend_plaintext: false      # no TLS at all — true only on a private container network
  #   backend_insecure: false       # keep TLS, stop checking the certificate: a reachability test
  #   backend_ca_file: /etc/otelcol-contrib/ca/your-ca.crt
  #   backend_client_cert_file: /etc/otelcol-contrib/ca/client.crt    # mutual TLS: who *we* are
  #   backend_client_key_file: /etc/otelcol-contrib/ca/client.key
  #
  # **How it is reached, and therefore what is on the wire.** OTLP defines HTTP as well as gRPC.
  # The transport is the reason the encoding is a choice at all: OTLP/gRPC is protobuf by
  # definition — the specification defines no JSON over gRPC — so while this channel had one
  # transport it had one encoding and there was nothing for a variable to set. Over HTTP, `json`
  # is OTLP/JSON, the readable and parseable half of the wire:
  #
  #   backend_protocol_config: /etc/otelcol-contrib/backend-http.yaml
  #   backend_http_endpoint: https://tempo.internal:4318
  #   backend_encoding: json        # or `proto`. Any other value stops the collector at validation
  #   backend_compression: gzip     # or none · zstd · snappy
  #
  # **Who we say we are.** A header, under whichever name the backend wants; unset sends no
  # credential of any kind. Grafana Cloud's HTTP basic is `Basic <base64 of instance-id:token>` as
  # the value. A credential that expires, or a backend with its own route per signal, is a recipe
  # in `deploy/compose/otel/recipes/` (ADR-0024):
  #
  #   backend_auth_config: /etc/otelcol-contrib/backend-auth-header.yaml
  #   backend_auth_header: x-api-key          # `Authorization` is what a *minority* ask for
  #   backend_authorization: <key>            # sent verbatim, scheme and all
  #
  # **How hard it pushes.** The defaults are the collector's own, so leaving these out changes
  # nothing. This channel's batching was unreachable until `FRD-620` while the other channel's had
  # two variables:
  #
  #   backend_batch_seconds: 200ms
  #   backend_batch_size: 8192
  #   backend_consumers: 10
  #   backend_queue: 1000
  #   backend_retry_initial: 5s
  #
  # **Off entirely**, keeping the delivery channel below — for an installation that wants the
  # access records and has no trace backend. Not the same as `enabled: false` above, which stops
  # the applications exporting and so stops *both* channels. It outranks `backend_protocol_config`,
  # so a channel that is off stays off however its transport is set:
  #
  #   backend_config: /etc/otelcol-contrib/nobackend.yaml

  # ---- Channel 2: delivery — one record per API access and per model access ------------------
  #
  # Off unless `forward_config` names the fragment. The endpoint alone does nothing: the fragment
  # is what makes it part of the collector's configuration at all.
  #
  #   forward_config: /etc/otelcol-contrib/forward.yaml
  #   forward_endpoint: https://receiver.internal:4318
  #
  # What it receives is **not** what your trace backend receives: traces are filtered to a request
  # and the calls made inside one — measured at 21 spans of 354 — because this channel wants one
  # record per request and the other wants the SQL underneath it. Metrics and logs go over whole.
  # The two are independent: separate pipelines, separate batching, and neither can retune the
  # other (`FRD-618`).
  #
  # **How it is reached.** OTLP defines gRPC as well as HTTP, and a receiver may implement either.
  # gRPC has one address, no scheme and no per-signal paths — and no JSON:
  #
  #   forward_protocol_config: /etc/otelcol-contrib/forward-grpc.yaml
  #   forward_grpc_endpoint: receiver.internal:4317
  #   forward_grpc_plaintext: false
  #
  # **What is on the wire.** The OTLP specification makes protobuf required and JSON optional, so
  # a conformant receiver may refuse JSON; several managed endpoints do. `none` compression is for
  # one that does not unwrap gzip — otherwise the symptom is a 400 about a malformed payload:
  #
  #   forward_encoding: json        # or `proto`. Any other value stops the collector at validation
  #   forward_compression: gzip     # or none · zstd · snappy
  #
  # **Who we say we are.** Nothing selected means no credential header at all. A header, under
  # whichever name the receiver wants; HTTP basic is `Basic <base64 of user:password>` as its value:
  #
  #   forward_auth_config: /etc/otelcol-contrib/forward-auth-header.yaml
  #   forward_auth_header: x-api-key     # `Authorization` is what a minority of receivers ask for
  #   # forward_authorization:           → Vault. It authenticates, so it is not in this file.
  #
  # **Beyond the core** — a receiver with its own route per signal, an OAuth2 token, Splunk HEC,
  # Azure Monitor — is a recipe in `deploy/compose/otel/recipes/`, selected through the two slots
  # above, with its own values in `deploy/compose/otel/custom/collector.env` (ADR-0024):
  #
  #   forward_protocol_config: /etc/otelcol-contrib/recipes/forward-splunk-hec.yaml
  #
  # **TLS.** A private CA is the answer to a receiver behind an internal one; `forward_insecure` is
  # not — that stops verifying every certificate on the leg. And the other direction, where the
  # receiver authenticates *us* by certificate:
  #
  #   forward_ca_file: /etc/otelcol-contrib/ca/your-ca.crt
  #   forward_client_cert_file: /etc/otelcol-contrib/ca/client.crt
  #   forward_client_key_file: /etc/otelcol-contrib/ca/client.key
  #
  # **How hard it pushes.** Polite rather than fast, because a destination one is attaching for the
  # first time is the one to be wrong about: the collector's own defaults forward every 200ms from
  # ten concurrent senders, and a 429 is retryable, so refusals tighten the loop.
  #
  #   forward_batch_seconds: 10s
  #   forward_batch_size: 8192
  #   forward_consumers: 1
  #   forward_queue: 5000
  #   forward_retry_initial: 5s
  #
  # **Everything above is commented out on purpose.** An empty value here is not "off" — it is
  # rendered into `.env` as an empty string, and `make config-verify` then reports the Compose
  # default taking over, because the file said one thing and the stack uses another. Off is the
  # line not being there.

log:
  level: INFO
  json: true
  queue_size: 1000
  retention_days: 30

# ---------------------------------------------------------------------------------------------
# Bounds. Every one of these refuses something, so every one of them is a decision.
# ---------------------------------------------------------------------------------------------
max:
  request_bytes: 1048576
  auth_failures_per_minute: 60
  embedding_batch: 64
  embedding_chars: 32768
  # A structured-output schema a caller may send: how big, how deep, how many properties.
  response_schema_bytes: 32768
  response_schema_depth: 8
  response_schema_properties: 256

# Records one ranking request may carry. Every hundred is a ranking query the provider bills.
rerank:
  max_records: 200

throttle:
  # Management's own per-user ceiling. A browser suite and a person sharing one account share this.
  user: 600/minute
  auth_failures: 60/minute

api:
  key_default_days: 30
  key_max_days: 365

cors:
  origins: https://aira.example.com
  allow_credentials: true

# ---------------------------------------------------------------------------------------------
# HashiCorp Vault — where every value this file deliberately omits comes from (`FRD-116`).
#
# **These are plain environment variables, not `AIRA_*` settings**, because they are read before
# the settings exist. The renderer emits them under their own names.
#
# Read **once, at startup**, and never on the request path. A configured Vault that cannot be
# reached is a *boot failure*, never a silent fall back to the environment. **Configured means
# `addr` and `role_id` both** (or a `VAULT_TOKEN` in the environment): an address alone reads
# nothing and says nothing, and every credential then comes from the environment.
# ---------------------------------------------------------------------------------------------
vault:
  addr: https://vault.example.com
  mount: secret
  path: aira
  # Identifies, does not authorise — safe here. The secret-id is the other half and never is: it
  # arrives as `VAULT_SECRET_ID_FILE` (or `VAULT_SECRET_ID`) in the containers' environment.
  role_id: 00000000-0000-0000-0000-000000000000
  namespace: ''
  timeout: 10

# ---------------------------------------------------------------------------------------------
# What is deliberately absent, and where it lives instead.
#
# Listed so the file is complete as a description even though it holds none of them. The renderer
# refuses any of these keys if somebody adds one, which is what makes the omission a rule.
# ---------------------------------------------------------------------------------------------
secrets:
  in_vault:
    - AIRA_SECRET_KEY                    # Django's signing key
    - AIRA_POSTGRES_PASSWORD
    - AIRA_VERTEX_CREDENTIALS            # the service account's whole JSON, as one value
    - AIRA_VERTEX_API_KEY
    - AIRA_VERTEX_FEDERATION_CLIENT_SECRET  # the gateway's client at your OIDC provider, for federation
    - AIRA_GOOGLE_API_KEY
    - AIRA_FOUNDRY_API_KEY
    - AIRA_KAFKA_SASL_PASSWORD
    - AIRA_GATEWAY_POSTGRES_PASSWORD     # a plane's own, in place of the shared one; optional
    - AIRA_MANAGEMENT_POSTGRES_PASSWORD
    - AIRA_GATEWAY_KAFKA_SASL_PASSWORD
    - AIRA_MANAGEMENT_KAFKA_SASL_PASSWORD
    - AIRA_DIRECTORY_CLIENT_SECRET
    - AIRA_PSEUDONYM_SECRET              # telemetry's pseudonyms under strict data mode
    - AIRA_REDIS_PASSWORD
    - AIRA_REDIS_SENTINEL_PASSWORD
  # The one credential Vault cannot supply, because it is what authenticates *to* Vault. An
  # environment variable in simple deployments; a projected volume on Kubernetes, which is why
  # `VAULT_SECRET_ID_FILE` exists.
  outside_vault:
    - VAULT_SECRET_ID
    - VAULT_SECRET_ID_FILE
