# AIRA — a standalone installation: everything in containers, one machine (`docs/SETUP.md` §3).
#
#     cp config/standalone.example.yaml config/my-installation.yaml
#     uv run python tools/config_render.py config/my-installation.yaml -o deploy/compose/.env
#     make up-full
#
# ## What this is, and what it honestly cannot be
#
# The same infrastructure as the showcase — Compose starts Keycloak, PostgreSQL, Kafka and Redis
# beside the applications — without the demo's seeded traffic. The addresses are therefore
# identical, and the interesting content of this file is what the bundled infrastructure **costs**,
# said out loud rather than inherited.
#
# `environment: local`, and that is a finding rather than a shortcut. The shipped stack cannot pass
# the checks any other value applies: its PostgreSQL password is **published in this repository**,
# its broker speaks `PLAINTEXT`, its Keycloak and Vault are plain HTTP on a private network. There
# is a mechanism for exactly that — `AIRA_DEMO_MODE` waives six named checks in
# `gateway/security.py`, a list and not a blanket — and it does not help here, because
# **Management has no equivalent**: its `unsafe_settings` exempts `local` and nothing else. Setting
# `environment: demo` therefore stops the control plane from migrating, naming three checks a demo
# is meant to waive. Measured, on this file, before it said `local`.
#
# So a standalone installation on the bundled stack is a local-grade deployment, and pretending
# otherwise produces a file that does not start. What to change to leave that behind, in the order
# that makes each next one possible:
#
#   1. a PostgreSQL whose password is not in a public repository;
#   2. a broker with TLS and SASL, so `kafka.security_protocol` is not `PLAINTEXT`;
#   3. TLS in front of Keycloak and Vault, so those URLs are `https://`;
#   4. `AIRA_SECRET_KEY` from Vault — set `vault.role_id` below;
#   5. `allowed.hosts` naming the real names, never `*`;
#
# and then `environment: production`, where all of it is checked. At that point you are describing
# `integrated.example.yaml`, which is the file for it.
#
# ## The shape
#
# A section is a prefix and a key completes it: `postgres.host` is `AIRA_POSTGRES_HOST`. `core:` is
# unprefixed, `vault:` becomes `VAULT_*`, and `secrets:` is prose — every credential comes from
# HashiCorp Vault (`FRD-116`), and the renderer refuses a key it recognises as one.

core:
  # `local` relaxes exactly the checks a laptop needs (`ADR-0007`); anything else demands an OIDC
  # audience, a real `secret_key`, and Kafka authentication that is not `PLAINTEXT`.
  environment: local
  # On, because the seeded accounts are how anybody signs in before a realm of your own exists.
  # It also waives six checks in the gateway (`WAIVED_BY_A_DEMO`) — which under `local` are
  # waived anyway. On a machine anybody else can reach, replace the infrastructure per the
  # header and turn this off; leaving it on for convenience is how a published password ends
  # up in front of real traffic.
  demo_mode: true
  debug: false
  # One log line per call to a system that is not ours, while you are wiring one up (`FRD-617`).
  # Empty is off and is what a working installation runs. Names: otel, kafka, auth, vault, redis,
  # postgres — or `all`. A name this build does not know refuses the process at start-up, rather
  # than starting and watching nothing.
  #
  #     debug_integrations: otel,kafka
  debug_integrations: ""
  # How many items of each OTLP batch to print as OTLP/JSON on stdout. 0 is off, and off is what
  # an installation runs — this renders on the exporter's thread, on every export.
  debug_otel_payload: 0
  app_name: AIRA Gateway
  # One installation, one currency. It labels every figure in the console, every CSV column and
  # the prices in the model catalog — see `docs/DEVLOG.md` for the round where three screens said
  # something else.
  currency: EUR
  # Which Keycloak group confers which AIRA role (`ADR-0017`). Group membership is the **only**
  # source of a role; a realm role on the same token is not read. Management refuses to start
  # without a group for `global-admin`.
  role_groups: global-admin=/aira/global-admins;it-security=/aira/it-security;it-steuerung=/aira/it-steuerung
  # A caller must name a use case. **Not** waived by `demo_mode`, so this is your decision
  # either way — turn it on last, once every client sends one (`docs/INTEGRATIONS.md` §9).
  require_use_case: false
  # Whether prompts and answers are stored at all, and for how long, unless a use case says
  # otherwise (`FRD-404`).
  store_payloads: true
  default_retention_days: 7
  auth_required: true
  # The three governance controls. Off means *measured and not enforced* — which is the honest way
  # to introduce them, and the wrong way to leave them.
  # (`enforce_budgets` off is one of the two named holes in `FRD-610` §3.2.)
  redact_patterns: ''
  trust_forwarded_for: false
  trusted_proxy_hops: 1

enforce:
  budgets: true
  rate_limits: true
  suspensions: true

# Watching traffic for the patterns `FRD-503` describes, and acting on them. `alert` first and
# `block` later is the order `docs/INTEGRATIONS.md` §9 argues for: a rule is a hypothesis until
# somebody has watched it be right, and a detector that blocks wrongly once is switched off for
# ever.
detect:
  anomalies: true

anomaly:
  interval_seconds: 60.0

# What a request is assumed to cost before the answer exists, so a budget can refuse *before* the
# money is spent rather than after. Too low and a budget is overshot by one request; too high and
# the last request of a period is refused for an answer that would have fitted.
budget:
  estimate_output_tokens: 1024

# ---------------------------------------------------------------------------------------------
# PostgreSQL — both planes, two databases on one server.
# ---------------------------------------------------------------------------------------------
postgres:
  host: postgres
  port: 5432
  db: aira_gateway
  user: aira
  # password: → Vault. See `secrets:`.

# ---------------------------------------------------------------------------------------------
# Keycloak (or any OIDC provider). What the realm must provide is `docs/INTEGRATIONS.md` §2.
# ---------------------------------------------------------------------------------------------
oidc:
  enabled: true
  # The **same URL the browser uses**. The `iss` claim is compared literally, so a browser on
  # `https://sso.example.com` and containers on `http://keycloak:8080` means one of the two
  # rejects every token.
  issuer: http://localhost:8080/realms/aira
  # Required outside `local`, and Keycloak does **not** put it in the token by itself: a public
  # client's `aud` is `["account"]` until an Audience mapper or a client scope says otherwise.
  audience: aira-gateway
  # **The console's own client**, and the only setting here that no settings class declares: the
  # SPA's entrypoint writes it into `runtime-config.js` at container start. One image, any realm.
  client_id: aira-gateway
  # **Leave empty only on the bundled stack.** The issuer is what the *browser* got the token
  # from and must match `iss` exactly; the JWKS is fetched by the container, which cannot reach a
  # `localhost` the browser can — so `docker-compose.apps.yml` substitutes an in-network default
  # when this is empty. Point at your own Keycloak and that default is somebody else's server:
  # set it explicitly, or the two halves of one address disagree in the direction nothing checks.
  jwks_uri: ''
  # Several realms at once (`FRD-118`), `issuer|audience|jwks_uri` per entry, `;`-separated.
  issuers: ''
  # How far the issuer's clock may run ahead of this host's. At 0 a service one second behind its
  # issuer refuses **every** freshly minted token, which reads exactly like a wrong secret.
  clock_skew_seconds: 60
  # How long past `exp` a token is still accepted. This is the half with a cost, so it is off.
  expiry_leeway_seconds: 0

# A read-only Keycloak service account, so the console can *search* your groups and people when
# granting access (`view-users`, `query-groups`, nothing else). Without it the console offers only
# what it already knows — and says so.
directory:
  client_id: ''
  # client_secret: → Vault.

# ---------------------------------------------------------------------------------------------
# The console, which is a static bundle behind nginx and is configured at **deployment** time
# (`docs/INTEGRATIONS.md` §7). None of these is a settings class: the entrypoint writes
# `runtime-config.js` from `oidc.issuer` and `oidc.client_id`, and templates the proxy from these.
# ---------------------------------------------------------------------------------------------

# What the console's content policy lets it call. Left empty it is derived from the issuer's
# origin, which is the only thing the console calls cross-origin — set it only for something the
# derivation cannot guess, a second origin or a websocket host. Getting it wrong produces a login
# that fails **in the browser and nowhere else**.
csp:
  connect_src: ''

# Where nginx sends `/api` and `/gw`.
management:
  upstream: http://management:8002
gateway:
  upstream: http://gateway:8001

# nginx re-resolves the upstreams on every request through this, so a redeploy of either service
# does not leave the proxy talking to an address that has moved. Docker's embedded DNS by default.
dns:
  resolver: 127.0.0.11

# ---------------------------------------------------------------------------------------------
# Apache Kafka — the bus the two planes speak over, and a trust boundary.
# ---------------------------------------------------------------------------------------------
kafka:
  bootstrap_servers: kafka:9092
  # `PLAINTEXT` is refused outside `local`: the gateway builds the read-model its authorization
  # comes from out of these topics.
  security_protocol: PLAINTEXT
  sasl_mechanism: ''
  sasl_username: ''
  # sasl_password: → Vault.
  ssl_cafile: ''

# ---------------------------------------------------------------------------------------------
# Redis — rate limits that hold across several gateway instances. Without it they are per-process.
# ---------------------------------------------------------------------------------------------
redis:
  url: redis://redis:6379/0

# ---------------------------------------------------------------------------------------------
# Model platforms. Configure the ones you have; an absent one is simply not offered.
# ---------------------------------------------------------------------------------------------

# Self-hosted, OpenAI-compatible (Ollama, vLLM, …). What this demo actually serves.
ollama:
  url: http://ollama:11434
  models: qwen3:0.6b
  embedding_models: all-minilm
  # Where the machine physically is, for the residency half of the register (`FRD-608`).
  region: local
  timeout_seconds: 120

# Several named OpenAI-compatible servers instead of the single endpoint above (`FRD-123`):
# `name=url|model,model;name2=url2|model`.
openai:
  servers: ''

# Google Agent Platform (formerly Vertex AI) — Gemini and Anthropic, EU-regional.
vertex:
  project: ''
  models: ''
  default_max_tokens: 4096
  timeout_seconds: 120
  # credentials / api_key: → Vault.

# Google AI Studio (the public Gemini API).
gemini:
  base_url: https://generativelanguage.googleapis.com
  models: ''

# Microsoft Foundry / Azure OpenAI.
foundry:
  endpoint: ''
  api_version: '2024-10-21'
  deployments: ''
  timeout_seconds: 120
  # api_key: → Vault.

# Where a model may be served from at all. A model reachable only at `global` is not usable here
# (`FRD-611`): `global` names no region and guarantees none.
allowed:
  regions: europe-west1,europe-west4,europe-north1,local
  # **Not `*` here, and the refusal is the feature.** A wildcard is waived only under
  # `environment: local`; on `demo` or `production` Management refuses to start and names it. List
  # the names this installation is served under — a bare host, an address, or both.
  hosts: localhost,127.0.0.1

# ---------------------------------------------------------------------------------------------
# Observability — OTLP to a collector, and from there wherever you send it (`ADR-0004`).
# ---------------------------------------------------------------------------------------------
otel:
  enabled: true
  endpoint: http://otel-collector:4318
  sample_ratio: 0.25

log:
  level: INFO
  json: true
  queue_size: 1000
  retention_days: 30

# ---------------------------------------------------------------------------------------------
# Bounds. Every one of these refuses something, so every one of them is a decision.
# ---------------------------------------------------------------------------------------------
max:
  request_bytes: 1048576
  auth_failures_per_minute: 60
  embedding_batch: 64
  embedding_chars: 32768
  # A structured-output schema a caller may send: how big, how deep, how many properties.
  response_schema_bytes: 32768
  response_schema_depth: 8
  response_schema_properties: 256

throttle:
  # Management's own per-user ceiling. A browser suite and a person sharing one account share this.
  user: 600/minute
  auth_failures: 60/minute

api:
  key_default_days: 30
  key_max_days: 365

cors:
  origins: http://localhost:4200
  allow_credentials: true

# ---------------------------------------------------------------------------------------------
# HashiCorp Vault — where every value this file deliberately omits comes from (`FRD-116`).
#
# **These are plain environment variables, not `AIRA_*` settings**, because they are read before
# the settings exist. The renderer emits them under their own names.
#
# Read **once, at startup**, and never on the request path. A configured Vault that cannot be
# reached is a *boot failure*, never a silent fall back to the environment.
# ---------------------------------------------------------------------------------------------
vault:
  addr: http://vault:8200
  mount: secret
  path: aira
  # Identifies, does not authorise — safe here. The secret-id is the other half and never is.
  #
  # **Fill this in for a standalone installation.** Outside `local`, `AIRA_SECRET_KEY` must not be
  # the development default and this file cannot carry it, so Vault is how it arrives:
  # `make vault-init` creates the path, the read-only policy and the AppRole, and prints the role
  # id to put here. Left empty, the services refuse to start and say which value is missing —
  # which is the right failure, and still a failure.
  role_id: ''
  namespace: ''
  timeout: 10

# ---------------------------------------------------------------------------------------------
# What is deliberately absent, and where it lives instead.
#
# Listed so the file is complete as a description even though it holds none of them. The renderer
# refuses any of these keys if somebody adds one, which is what makes the omission a rule.
# ---------------------------------------------------------------------------------------------
secrets:
  in_vault:
    - AIRA_SECRET_KEY                    # Django's signing key
    - AIRA_POSTGRES_PASSWORD
    - AIRA_VERTEX_SERVICE_ACCOUNT_JSON   # the whole JSON, as one value
    - AIRA_VERTEX_API_KEY
    - AIRA_GOOGLE_API_KEY
    - AIRA_AZURE_API_KEY
    - AIRA_FOUNDRY_API_KEY
    - AIRA_OPENAI_API_KEY
    - AIRA_KAFKA_SASL_PASSWORD
    - AIRA_DIRECTORY_CLIENT_SECRET
  # The one credential Vault cannot supply, because it is what authenticates *to* Vault. An
  # environment variable in simple deployments; a projected volume on Kubernetes, which is why
  # `VAULT_SECRET_ID_FILE` exists.
  outside_vault:
    - VAULT_SECRET_ID
    - VAULT_SECRET_ID_FILE
