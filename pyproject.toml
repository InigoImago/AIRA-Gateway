# AIRA — uv workspace root (virtual; no package of its own).
# Shared tooling config lives here; each member has its own pyproject.

[tool.uv]
# **Floors for what the workspace only reaches through another package.** None of these is a
# dependency of ours, so no member can state its floor; a constraint takes part in every resolution
# without installing anything. Each is the first release no published advisory names, and
# `tools/tests/test_no_dependency_is_locked_below_its_advisory.py` holds the lock to it.
constraint-dependencies = [
    # GHSA-6q48-6c7w-9gw2: the bundle before it trusts a root whose intermediates' private keys
    # were compromised — and it is the trust store of every upstream and Vault connection.
    "certifi>=2026.10.19",
    # Streaming decompression and proxy TLS advisories (GHSA-vxq7-64xx-v4gw, GHSA-gh4c-6fx4-qh6g,
    # GHSA-8988-9cw3-xx77).
    "urllib3>=2.8.0",
    # Quadratic and backtracking parses of SQL text (GHSA-prg7-hcfm-mfcr and four more).
    "sqlparse>=0.6.0",
    # CVE-2026-102991, a template path that escapes its directory on Windows. Not reachable here —
    # Alembic renders its own templates, on Linux — and a scanner of the gateway image names it.
    "mako>=1.4.2",
]

[tool.uv.workspace]
members = ["gateway", "libs", "management/backend"]

[tool.uv.sources]
aira-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "fakeredis[lua]>=2.26",
    "google-genai>=2.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["gateway/src", "libs/src"]
# Ruff formats Python fenced in Markdown, and the code in our documents is illustrative rather than
# compiled — a snippet is often deliberately partial, and a supplied contract document is not ours
# to restyle. Reformatting prose to satisfy a code formatter is the tail wagging the dog; the gate
# is for code we own.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# `W` was added on 2026-09-08, after a `SyntaxWarning` surfaced from a *docstring* — `\b` and `\+`
# in a paragraph explaining a regex — and only because an edit invalidated the `.pyc` beside it.
# Python emits that warning at **compile** time, so a cached module never prints it: the one file
# in this repository carrying an invalid escape had been there since August, said "such sequences
# will not work in the future", and no gate could see it. `W605` is the rule; the family is clean
# and comes with it, so the gate is the family rather than one rule somebody has to know about.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "W"]
# ASYNC109: exposing an explicit `timeout` parameter is a deliberate API choice here.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# The mutation anchors are verbatim copies of source lines: reflowing one to satisfy the line
# length would silently stop it matching, and the tool would report a property as undefended
# when nothing had changed about the code.
"tools/mutation_check.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses these call expressions in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy", "mypy_django_plugin.main"]
mypy_path = ["gateway/src", "libs/src", "management/backend/src"]

[tool.django-stubs]
django_settings_module = "aira_management.config.settings"

[[tool.mypy.overrides]]
module = ["aira_gateway.*", "aira_common.*", "aira_management.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# `google.protobuf.json_format` ships no stubs, and it is read in exactly one place:
# rendering an OTLP batch as JSON for `AIRA_DEBUG_OTEL_PAYLOAD`. Adding `types-protobuf` to the
# dependency group would put a stub package in every deployment for one debug call.
module = ["guardian.*", "aiokafka.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# `tools/` on the path so every layer can `import stack_addresses` — the one module that knows
# where the local stack answers. Each importer used to insert the path itself, which is four
# copies of the same three lines and one more thing a new test file has to remember.
pythonpath = ["tools"]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "aira_management.config.settings"
testpaths = [
    "gateway/tests",
    "libs/tests",
    "management/backend/tests",
    # Checks about the repository itself rather than about the product: that the documentation's
    # claims match the harness, that a shared library declares what it imports. They belong in the
    # default run, because a check nobody runs is a check nobody has.
    "tools/tests",
    "tests/integration",
]
# importlib mode lets same-named test modules coexist across packages.
# `-m "not integration"` keeps the default run hermetic (CI unit stage); integration tests
# (which need the live Compose stack) run separately via `make test-integration`.
addopts = "-q --import-mode=importlib -m 'not integration' --cov=aira_gateway --cov=aira_common --cov=aira_management --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: requires the live Docker Compose stack (excluded from the default run)",
    "real_metadata_probe: lets the test reach the Google Cloud detection itself",
]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.coverage.run]
branch = true
source = ["aira_gateway", "aira_common", "aira_management"]
omit = ["*/asgi.py", "*/wsgi.py", "*/manage.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
