# gemini-rust, pointed at AIRA: cargo run
[package]
name = "aira-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures = "0.3"
gemini-rust = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
